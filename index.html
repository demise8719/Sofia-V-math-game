<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sofia Villarreal Castañeda's Math Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6C5CE7; --purple-d:#4A3BB0; --purple-l:#EFEBFF;
  --pink:#FF5DA2;   --pink-d:#D63F82;   --pink-l:#FFEAF3;
  --teal:#00D9C0;   --teal-d:#00A896;   --teal-l:#E3FFFB;
  --gold:#FFC93C;   --gold-d:#E0A800;   --gold-l:#FFF6DE;
  --blue:#4FC3F7;   --blue-d:#1E9FDB;   --blue-l:#E6F8FF;
  --green:#6EE7A8;  --green-d:#2FBE7A;  --green-l:#E7FFF2;
  --orange:#FF9F5A; --orange-d:#E67A2E; --orange-l:#FFF1E6;
  --ink:#241B45; --ink-soft:#6A5F99;
  --bg1:#1B1035; --bg2:#2E1E5E;
  --panel:#FFFFFF;
  --ok:#2FBE7A; --bad:#FF5A6E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  background:
    radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.5) 100%, transparent),
    radial-gradient(1.5px 1.5px at 130px 80px, rgba(255,255,255,.35) 100%, transparent),
    radial-gradient(2px 2px at 60px 140px, rgba(255,255,255,.4) 100%, transparent),
    radial-gradient(1.5px 1.5px at 200px 60px, rgba(255,255,255,.3) 100%, transparent),
    radial-gradient(1.5px 1.5px at 240px 180px, rgba(255,255,255,.4) 100%, transparent),
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 42px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 42px),
    linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg1));
  background-size: 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 42px 42px, 42px 42px, 100% 100%;
  min-height:100vh;
  color:var(--ink);
}
.blocky-text{
  color:#fff; text-shadow:
    -2px -2px 0 rgba(0,0,0,.5), 2px -2px 0 rgba(0,0,0,.5),
    -2px 2px 0 rgba(0,0,0,.5), 2px 2px 0 rgba(0,0,0,.5),
    0 4px 0 rgba(0,0,0,.3);
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
button{font-family:inherit;}
#app{max-width:900px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}

/* ---------- chunky pressable button ---------- */
.chunky{
  border:none; border-radius:16px; cursor:pointer;
  font-family:'Baloo 2',sans-serif; font-weight:700; color:#fff;
  padding:14px 22px; font-size:17px;
  transition:transform .06s ease, box-shadow .06s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.chunky:active{transform:translateY(5px);}
.chunky:focus-visible{outline:3px solid #fff; outline-offset:2px;}
.c-purple{background:var(--purple); box-shadow:0 5px 0 var(--purple-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-purple:active{box-shadow:0 0 0 var(--purple-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-pink{background:var(--pink); box-shadow:0 5px 0 var(--pink-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-pink:active{box-shadow:0 0 0 var(--pink-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-teal{background:var(--teal); box-shadow:0 5px 0 var(--teal-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-teal:active{box-shadow:0 0 0 var(--teal-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-gold{background:var(--gold); box-shadow:0 5px 0 var(--gold-d), inset 0 2px 0 rgba(255,255,255,.5); color:#4A3200;}
.c-gold:active{box-shadow:0 0 0 var(--gold-d), inset 0 2px 0 rgba(255,255,255,.5);}
.c-blue{background:var(--blue); box-shadow:0 5px 0 var(--blue-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-blue:active{box-shadow:0 0 0 var(--blue-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-green{background:var(--green); box-shadow:0 5px 0 var(--green-d), inset 0 2px 0 rgba(255,255,255,.4); color:#0B4A2C;}
.c-green:active{box-shadow:0 0 0 var(--green-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-orange{background:var(--orange); box-shadow:0 5px 0 var(--orange-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-orange:active{box-shadow:0 0 0 var(--orange-d), inset 0 2px 0 rgba(255,255,255,.4);}

/* ---------- HUD ---------- */
#hud{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:14px;
  padding:12px 18px; margin-bottom:6px;
  background:rgba(27,16,53,.72); backdrop-filter:blur(10px);
  border-bottom:2px solid rgba(255,255,255,.08);
}
.avatar-badge{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(145deg,var(--gold-l),var(--orange-l));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0; box-shadow:0 3px 0 rgba(0,0,0,.25); overflow:hidden;
}
.avatar-badge svg{width:56px;height:56px;}
.hud-name{color:#fff;font-weight:800;font-size:14px;line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px;}
.hud-sub{color:#C9BFFF;font-size:12px;font-weight:700;}
.level-badge{
  background:linear-gradient(180deg, #FFE18A, var(--gold)); color:#4A3200; font-family:'Baloo 2';
  font-weight:800; font-size:12px; border-radius:20px; padding:2px 9px;
  display:inline-block; margin-top:2px; border:2px solid var(--gold-d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
.xp-wrap{flex:1; min-width:60px;}
.xp-bar-bg{height:10px;border-radius:6px;background:rgba(255,255,255,.15); overflow:hidden;}
.xp-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--blue)); transition:width .4s ease;}
.coin-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,201,60,.15); border:2px solid var(--gold);
  border-radius:20px; padding:5px 12px; color:#FFE9A8; font-weight:800; font-size:14px;
  flex-shrink:0; box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.lang-toggle{
  flex-shrink:0; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.1);
  color:#fff; border-radius:16px; padding:6px 11px; font-family:'Baloo 2'; font-weight:800;
  font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px;
}
.lang-toggle:active{transform:translateY(2px);}

.stats-panel{
  position:fixed; top:70px; right:16px; background:#fff; color:var(--ink); border-radius:16px;
  padding:16px 18px; box-shadow:0 10px 24px rgba(0,0,0,.4); z-index:60; font-family:'Baloo 2';
  min-width:190px; border:3px solid rgba(36,27,69,.14); animation:popIn .3s ease;
}
.stats-panel .stats-title{font-size:13px; color:var(--ink-soft); font-weight:800; text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.stats-panel .row{display:flex; justify-content:space-between; align-items:baseline; gap:14px; font-size:14px; margin:6px 0;}
.stats-panel .row span{color:var(--ink-soft); font-weight:700;}
.stats-panel .row b{color:var(--purple); font-size:17px;}
.stats-close{margin-top:10px; width:100%; padding:9px; font-size:13px;}

/* ---------- Name screen ---------- */
.center-screen{min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
.rocket-emoji{font-size:64px; margin-bottom:6px; animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.title-hero{color:#fff; font-size:44px; margin:0; letter-spacing:.5px;}
.title-hero span{color:var(--gold);}
.subtitle-hero{color:#C9BFFF; font-size:16px; margin:8px 0 28px; max-width:360px;}
#nameInput{
  font-family:'Baloo 2'; font-size:20px; padding:14px 18px; border-radius:16px;
  border:3px solid var(--purple); width:260px; text-align:center; margin-bottom:18px;
  outline:none;
}
#nameInput:focus{border-color:var(--pink);}

/* ---------- Hub ---------- */
.hub-header{padding:18px 20px 4px;}
.hub-header-inner{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.plush-hero{flex-shrink:0; animation:float 4s ease-in-out infinite;}
.plush-hero svg{width:108px; height:108px; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));}
.hub-header h2{margin:0 0 2px; font-size:27px;}
.hub-header p{color:#C9BFFF; margin:0; font-size:14px; max-width:420px;}
.tile-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px; padding:18px 20px 30px;
}
.tile{
  background:var(--panel); border-radius:18px; overflow:hidden;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 8px 0 rgba(0,0,0,.25), 0 14px 24px rgba(0,0,0,.35);
  transition:transform .15s ease, box-shadow .15s ease;
  display:flex; flex-direction:column;
}
.tile:hover{transform:translateY(-4px); box-shadow:0 12px 0 rgba(0,0,0,.25), 0 20px 30px rgba(0,0,0,.4);}
.tile-top{
  height:110px; display:flex; align-items:center; justify-content:center;
  font-size:52px; position:relative;
  border-bottom:3px solid rgba(0,0,0,.15);
}
.tile-top .stars{position:absolute; bottom:8px; right:10px; font-size:13px; letter-spacing:1px;}
.tile-body{padding:14px 16px 16px;}
.tile-body h3{margin:0 0 2px; font-size:17px; color:var(--ink);}
.tile-body .tsub{margin:0 0 10px; font-size:12.5px; color:var(--ink-soft); font-weight:700;}
.tile-body .tdesc{margin:0 0 14px; font-size:13px; color:#7c72a3; line-height:1.35;}
.tile-play{width:100%; text-align:center; padding:11px; font-size:15px;}

/* ---------- Game screen ---------- */
.game-wrap{padding:18px 20px 40px;}
.game-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; color:#fff;}
.back-link{background:none;border:none;color:#C9BFFF;font-weight:800;font-family:'Baloo 2';cursor:pointer;font-size:14px;display:flex;align-items:center;gap:4px;}
.progress-dots{display:flex;gap:6px;}
.pdot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);}
.pdot.done{background:var(--teal);}
.pdot.current{background:var(--gold); transform:scale(1.3);}
.streak-chip{display:flex;align-items:center;gap:4px;background:rgba(255,159,90,.18);border:2px solid var(--orange);border-radius:16px;padding:3px 10px;font-weight:800;color:#FFD9B8;font-size:13px;}

.q-card{
  background:var(--panel); border-radius:22px; padding:32px 26px;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 10px 0 rgba(0,0,0,.25), 0 18px 30px rgba(0,0,0,.35);
  text-align:center;
}
.q-prompt{font-family:'Baloo 2'; font-size:26px; color:var(--ink); margin:0 0 22px; line-height:1.3;}
.choices-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.choices-grid.two{grid-template-columns:1fr 1fr;}
@media (max-width:480px){.q-prompt{font-size:21px;} .choices-grid{grid-template-columns:1fr;}}
.choice-btn{
  border-radius:14px; border:none; padding:18px 10px; font-family:'Baloo 2';
  font-weight:700; font-size:19px; cursor:pointer; background:var(--purple-l); color:var(--purple-d);
  box-shadow:0 5px 0 #D9D0FF, inset 0 2px 0 rgba(255,255,255,.7); transition:transform .06s ease, box-shadow .06s ease, background .15s;
}
.choice-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #D9D0FF, inset 0 2px 0 rgba(255,255,255,.7);}
.choice-btn.correct{background:var(--green); color:#0B4A2C; box-shadow:0 5px 0 var(--green-d), inset 0 2px 0 rgba(255,255,255,.5);}
.choice-btn.wrong{background:#FFD3D8; color:#8A1F2E; box-shadow:0 5px 0 var(--bad), inset 0 2px 0 rgba(255,255,255,.5);}
.choice-btn:disabled{cursor:default;}
.feedback-row{min-height:34px; margin-top:16px; font-family:'Baloo 2'; font-weight:700; font-size:16px;}
.feedback-row.ok{color:var(--ok);}
.feedback-row.bad{color:var(--bad);}
.next-btn{margin-top:14px;}

/* mini grid visual (identify) */
.mini-grid-wrap{display:flex; justify-content:center; margin-bottom:18px;}

/* interactive plot grid */
.plot-grid{
  display:grid; grid-template-columns:repeat(10, 1fr); gap:2px;
  max-width:340px; margin:0 auto 18px; background:var(--purple-l); padding:6px; border-radius:14px;
}
.plot-cell{
  aspect-ratio:1/1; background:#fff; border-radius:4px; cursor:pointer; border:none;
  transition:background .1s;
}
.plot-cell:hover{background:var(--purple-l);}
.plot-cell.origin{background:#EDE9FF;}
.plot-cell.picked-correct{background:var(--green);}
.plot-cell.picked-wrong{background:var(--bad);}
.plot-cell.reveal{background:var(--gold);}

/* ---------- Summary ---------- */
.summary-card{
  background:var(--panel); border-radius:22px; padding:34px 26px; text-align:center;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 10px 0 rgba(0,0,0,.25), 0 18px 30px rgba(0,0,0,.35); margin:30px 20px;
}
.stars-row{font-size:42px; margin:10px 0 18px; letter-spacing:6px;}
.summary-stats{display:flex; justify-content:center; gap:26px; margin:18px 0 26px;}
.stat-box{font-family:'Baloo 2';}
.stat-box .num{font-size:26px; color:var(--purple);}
.stat-box .lbl{font-size:12px; color:var(--ink-soft); font-weight:800; text-transform:uppercase;}
.summary-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

/* floating +xp / +coin popup */
.float-pop{
  position:fixed; font-family:'Baloo 2'; font-weight:800; font-size:18px; pointer-events:none;
  z-index:50; animation:floatUp 1s ease forwards;
}
@keyframes floatUp{0%{opacity:0; transform:translateY(0) scale(.8);}15%{opacity:1; transform:translateY(-6px) scale(1.05);}100%{opacity:0; transform:translateY(-60px) scale(1);}}

.levelup-toast{
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,var(--gold),var(--orange)); color:#4A3200;
  font-family:'Baloo 2'; font-weight:800; padding:12px 22px; border-radius:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.4); z-index:60; animation:popIn .5s ease;
}
@keyframes popIn{0%{opacity:0; transform:translate(-50%,-20px) scale(.7);}60%{opacity:1; transform:translate(-50%,4px) scale(1.05);}100%{transform:translate(-50%,0) scale(1);}}

.sr-only{position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0);}

.spider-corner{
  position:fixed; bottom:14px; right:16px; font-size:26px; cursor:pointer;
  animation:spiderWiggle 4s ease-in-out infinite; z-index:15; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
}
@keyframes spiderWiggle{0%,100%{transform:rotate(0deg) translateY(0);}25%{transform:rotate(-8deg) translateY(-2px);}75%{transform:rotate(8deg) translateY(2px);}}
.spider-toast{
  position:fixed; bottom:50px; right:16px; max-width:220px;
  background:#fff; color:var(--ink); font-weight:800; font-size:13px; font-family:'Baloo 2';
  padding:10px 14px; border-radius:14px 14px 4px 14px; box-shadow:0 6px 18px rgba(0,0,0,.4);
  z-index:16; animation:popIn .3s ease;
}
</style>
</head>

<script>
/* ============================================================
   HELPERS
   ============================================================ */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function lcm(a,b){return (a*b)/gcd(a,b);}
function simplifyFrac(n,d){if(n===0)return[0,1];const g=gcd(n,d);return[n/g,d/g];}
function fracStr(n,d){d=Math.round(d);n=Math.round(n);if(d===1)return `${n}`;if(d<0){d=-d;n=-n;}return `${n}/${d}`;}
function fracVal(s){ if(String(s).includes('/')){const[n,d]=String(s).split('/').map(Number); return n/d;} return Number(s); }
function addDistractor(choices, answerVal, candidate){
  if(String(candidate).includes('/')){
    const [n,d]=String(candidate).split('/').map(Number);
    if(d<=0 || n<0) return;
  } else if(Number(candidate)<0) return;
  const cVal = fracVal(candidate);
  if(Math.abs(cVal-answerVal) < 1e-9) return;
  for(const existing of choices){ if(Math.abs(fracVal(existing)-cVal) < 1e-9) return; }
  choices.add(candidate);
}
function addNumDistractor(choices, answerVal, candidate, decimals){
  const key = Number(candidate).toFixed(decimals);
  if(Math.abs(Number(key)-answerVal) < Math.pow(10,-decimals)/2) return;
  for(const existing of choices){ if(existing===key) return; }
  choices.add(key);
}
function mcQuestionInt(prompt, answer, spread){
  spread = spread || Math.max(2, Math.round(Math.abs(answer)*0.2)+1);
  const choices = new Set([answer]);
  let tries=0;
  while(choices.size<4 && tries<50){
    tries++;
    const d = answer + randInt(-spread, spread);
    if(d>=0 && d!==answer) choices.add(d);
  }
  while(choices.size<4) choices.add(answer+choices.size+1);
  return {type:'mc', prompt, choices: shuffle([...choices]).map(String), answer:String(answer)};
}

   LANGUAGE / i18n

const PLACE_NAMES_I18N = { en:['ones','tenths','hundredths','thousandths'], es:['unidades','décimas','centésimas','milésimas'] };

/* ---- Multiplication & Division ---- */
function genMultDiv(){
  const t = randInt(0,2);
  if(t===0){ const a=randInt(12,98), b=randInt(2,9); return mcQuestionInt(`${a} × ${b} = ?`, a*b); }
  if(t===1){ const a=randInt(11,49), b=randInt(11,29); return mcQuestionInt(`${a} × ${b} = ?`, a*b); }
  const b=randInt(2,12), q=randInt(3,20), a=b*q; return mcQuestionInt(`${a} ÷ ${b} = ?`, q);
}

/* ---- Fractions ---- */
const FRAC_DENOMS = [2,3,4,5,6,8];
function genFracAddSub(isAdd){
  let d1,d2,tries=0;
  do{ d1=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)]; d2=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)]; tries++; }
  while((d1===d2 || lcm(d1,d2)>40) && tries<50);
  let n1=randInt(1,d1-1), n2=randInt(1,d2-1);
  const L=lcm(d1,d2);
  let numA=n1*(L/d1), numB=n2*(L/d2);
  if(!isAdd && numA<numB){ [numA,numB]=[numB,numA]; [n1,n2]=[n2,n1]; [d1,d2]=[d2,d1]; }
  const rawNum = isAdd ? numA+numB : numA-numB;
  const [sn,sd]=simplifyFrac(rawNum,L);
  const prompt=`${n1}/${d1} ${isAdd?'+':'-'} ${n2}/${d2} = ?`;
  const answerStr=fracStr(sn,sd), answerVal=sn/sd;
  const choices=new Set([answerStr]);
  addDistractor(choices,answerVal,fracStr(rawNum,L));
  addDistractor(choices,answerVal,fracStr(isAdd? n1+n2 : Math.abs(n1-n2), d1+d2));
  let tries2=0;
  while(choices.size<4 && tries2<50){tries2++; const t=sn+randInt(-2,3); if(t>0) addDistractor(choices,answerVal,fracStr(t,sd));}
  let filler=1;
  while(choices.size<4){ addDistractor(choices,answerVal,fracStr(sn+filler,sd+filler)); filler++; if(filler>20) break; }
  return {type:'mc', prompt, choices:shuffle([...choices]), answer:answerStr};
}
function genFracMulWhole(){
  const d=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)];
  const n=randInt(1,d-1), w=randInt(2,6);
  const [sn,sd]=simplifyFrac(n*w,d);
  const prompt=`${n}/${d} × ${w} = ?`;
  const answerStr=fracStr(sn,sd), answerVal=sn/sd;
  const choices=new Set([answerStr]);
  addDistractor(choices,answerVal,fracStr(n*w,d));
  addDistractor(choices,answerVal,fracStr(n+w,d));
  let tries=0;
  while(choices.size<4 && tries<50){tries++; const t=sn+randInt(-2,3); if(t>0) addDistractor(choices,answerVal,fracStr(t,sd));}
  let filler=1;
  while(choices.size<4){ addDistractor(choices,answerVal,fracStr(sn+filler,sd+filler+1)); filler++; if(filler>20) break; }
  return {type:'mc', prompt, choices:shuffle([...choices]), answer:answerStr};
}
function genFracCompare(){
  const d1=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)], d2=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)];
  let n1=randInt(1,d1-1), n2=randInt(1,d2-1);
  if(n1*d2===n2*d1) n2 = n2===d2-1? n2-1 : n2+1;
  const cmp=(n1*d2)>(n2*d1);
  const f1=fracStr(n1,d1), f2=fracStr(n2,d2);
  const answer=cmp?f1:f2;
  const prompt = LANG==='en' ? `Which fraction is greater: ${f1} or ${f2}?` : `¿Qué fracción es mayor: ${f1} o ${f2}?`;
  return {type:'mc', prompt, choices:shuffle([f1,f2]), answer};
}

/* ---- Decimals ---- */
function genDecAddSub(isAdd){
  let a=randInt(100,999)/100, b=randInt(10,899)/100;
  if(!isAdd && a<b) [a,b]=[b,a];
  let val = isAdd ? a+b : a-b;
  val = Math.round(val*100)/100;
  const answerStr=val.toFixed(2);
  const prompt=`${a.toFixed(2)} ${isAdd?'+':'-'} ${b.toFixed(2)} = ?`;
  const choices=new Set([answerStr]);
  addNumDistractor(choices,val,val+0.1,2); addNumDistractor(choices,val,val-0.1,2); addNumDistractor(choices,val,val+0.01,2);
  let tries=0; while(choices.size<4 && tries<30){tries++; addNumDistractor(choices,val,val+randInt(-20,20)/100,2);}
  return {type:'mc', prompt, choices:shuffle([...choices]), answer:answerStr};
}
function genDecMul(){
  const a=randInt(11,99)/10, w=randInt(2,9);
  const val=Math.round(a*w*100)/100;
  const answerStr=val.toFixed(2);
  const prompt=`${a.toFixed(1)} × ${w} = ?`;
  const choices=new Set([answerStr]);
  addNumDistractor(choices,val,val+w/10,2); addNumDistractor(choices,val,a*(w+1),2); addNumDistractor(choices,val,a*(w-1),2);
  let tries=0; while(choices.size<4 && tries<30){tries++; addNumDistractor(choices,val,val+randInt(-15,15)/10,2);}
  return {type:'mc', prompt, choices:shuffle([...choices]), answer:answerStr};
}
function genDecPlaceValue(){
  const ones=randInt(1,9), t=randInt(0,9), h=randInt(0,9), th=randInt(0,9);
  const numStr=`${ones}.${t}${h}${th}`;
  const placeIdx=randInt(1,3);
  const digit=[ones,t,h,th][placeIdx];
  const names = PLACE_NAMES_I18N[LANG];
  const prompt = LANG==='en'
    ? `In the number ${numStr}, what is the value of the digit ${digit} in the ${names[placeIdx]} place?`
    : `En el número ${numStr}, ¿cuál es el valor del dígito ${digit} en el lugar de las ${names[placeIdx]}?`;
  const answer=`${digit} ${names[placeIdx]}`;
  const choices=shuffle(names.map(p=>`${digit} ${p}`));
  return {type:'mc', prompt, choices, answer};
}
function genDecCompare(){
  const vals=new Set();
  while(vals.size<4){
    const style=randInt(0,2);
    let v;
    if(style===0) v=randInt(1,9)/10; else if(style===1) v=randInt(1,99)/100; else v=randInt(1,999)/1000;
    vals.add(v);
  }
  const arr=[...vals];
  const wantGreatest=Math.random()<0.5;
  const target = wantGreatest? Math.max(...arr) : Math.min(...arr);
  const strs = arr.map(String);
  const answer = String(target);
  const prompt = LANG==='en'
    ? `Which number is the ${wantGreatest?'greatest':'least'}?`
    : `¿Cuál número es el ${wantGreatest?'mayor':'menor'}?`;
  return {type:'mc', prompt, choices:shuffle(strs), answer};
}

/* ---- Order of operations ---- */
function genOrderOps(){
  const t=randInt(0,3);
  let prompt, val;
  if(t===0){ const a=randInt(2,9),b=randInt(2,9),c=randInt(2,9); val=(a+b)*c; prompt=`(${a} + ${b}) × ${c} = ?`; }
  else if(t===1){ const a=randInt(2,9), b=randInt(5,12), c=randInt(1,b-1); val=a*(b-c); prompt=`${a} × (${b} - ${c}) = ?`; }
  else if(t===2){ const c=randInt(2,6), q=randInt(2,9), b=randInt(1,9), a=b+c*q, d=randInt(1,9); val=q+d; prompt=`(${a} - ${b}) ÷ ${c} + ${d} = ?`; }
  else { const a=randInt(1,20), b=randInt(2,9), c=randInt(2,9); val=a+b*c; prompt=`${a} + ${b} × ${c} = ?`; }
  return mcQuestionInt(prompt, val);
}

/* ---- Volume ---- */
function genVolume(){
  const l=randInt(2,9), w=randInt(2,9), h=randInt(2,9), V=l*w*h;
  const scene = randInt(0,2);
  const unit = scene===0 ? 'ft' : 'cm';
  if(LANG==='en'){
    const noun = scene===0 ? "Sofia's swimming pool" : scene===1 ? "Wow Wow's toy chest" : 'A fish tank';
    const deepWord = scene===0 ? 'deep' : 'tall';
    if(Math.random()<0.5) return mcQuestionInt(`${noun} is ${l} ${unit} long, ${w} ${unit} wide, and ${h} ${unit} ${deepWord}. What is its volume?`, V);
    return mcQuestionInt(`${noun} has a volume of ${V} cubic ${unit}. It is ${l} ${unit} long and ${w} ${unit} wide. How ${deepWord} is it?`, h, 2);
  } else {
    const noun = scene===0 ? "la alberca de Sofia" : scene===1 ? "el baúl de juguetes de Wow Wow" : 'una pecera';
    const deepWord = scene===0 ? 'profunda' : 'alta';
    if(Math.random()<0.5) return mcQuestionInt(`${noun.charAt(0).toUpperCase()+noun.slice(1)} mide ${l} ${unit} de largo, ${w} ${unit} de ancho y ${h} ${unit} de ${deepWord==='profunda'?'profundidad':'altura'}. ¿Cuál es su volumen?`, V);
    return mcQuestionInt(`${noun.charAt(0).toUpperCase()+noun.slice(1)} tiene un volumen de ${V} ${unit} cúbicos. Mide ${l} ${unit} de largo y ${w} ${unit} de ancho. ¿Qué tan ${deepWord} es?`, h, 2);
  }
}

/* ---- Coordinate plane ---- */
function genGrid(){
  const x=randInt(0,9), y=randInt(0,9);
  if(Math.random()<0.5){
    // identify: show marked point, choose coordinates
    const answer=`(${x}, ${y})`;
    const choices=new Set([answer]);
    const opts=[[x+1,y],[x-1,y],[x,y+1],[x,y-1],[y,x]];
    for(const [ox,oy] of shuffle(opts)){
      if(ox>=0&&ox<=9&&oy>=0&&oy<=9){ const s=`(${ox}, ${oy})`; if(s!==answer) choices.add(s); }
      if(choices.size>=4) break;
    }
    let guard=0;
    while(choices.size<4 && guard<30){ guard++; const ox=randInt(0,9), oy=randInt(0,9); const s=`(${ox}, ${oy})`; if(s!==answer) choices.add(s); }
    return {type:'grid-identify', prompt: LANG==='en' ? 'What are the coordinates of the marked point?' : '¿Cuáles son las coordenadas del punto marcado?', target:{x,y}, choices:shuffle([...choices]), answer};
  }
  const plotPrompt = LANG==='en' ? `Plot the point (${x}, ${y})` : `Traza el punto (${x}, ${y})`;
  return {type:'grid-plot', prompt:plotPrompt, target:{x,y}};
}

/* ---- Word problems ---- */
const FRIEND_NAMES = ['Sofia','Sofia','Emma','Camila','Isabella'];
function genWord(){
  const t=randInt(0,3);
  if(t===0){
    const name = FRIEND_NAMES[randInt(0,FRIEND_NAMES.length-1)];
    const c=randInt(3,8), b=randInt(2,9), a=randInt(c*b+5, c*b+40);
    const prompt = LANG==='en'
      ? `${name} has ${a} dog treats for Wow Wow. She gives ${b} treats to each of ${c} of Wow Wow's doggy friends. How many treats does she have left?`
      : `${name} tiene ${a} premios para Wow Wow. Le da ${b} premios a cada uno de los ${c} amigos peludos de Wow Wow. ¿Cuántos premios le quedan?`;
    return mcQuestionInt(prompt, a-b*c);
  }
  if(t===1){
    const d=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)]; const n=randInt(1,d-1); const w=randInt(2,5);
    const [sn,sd]=simplifyFrac(n*w,d);
    const answerStr=fracStr(sn,sd), answerVal=sn/sd;
    const choices=new Set([answerStr]);
    addDistractor(choices,answerVal,fracStr(n*w,d)); addDistractor(choices,answerVal,fracStr(n+w,d));
    let tries=0; while(choices.size<4 && tries<50){tries++; const tw=sn+randInt(-2,3); if(tw>0) addDistractor(choices,answerVal,fracStr(tw,sd));}
    let filler=1; while(choices.size<4){addDistractor(choices,answerVal,fracStr(sn+filler,sd+filler+1)); filler++; if(filler>20) break;}
    const prompt = LANG==='en'
      ? `A pizza recipe needs ${n}/${d} cup of cheese. Sofia wants to make ${w} pizzas for a pool party. How many cups of cheese does she need in total?`
      : `Una receta de pizza necesita ${n}/${d} de taza de queso. Sofia quiere hacer ${w} pizzas para una fiesta en la alberca. ¿Cuántas tazas de queso necesita en total?`;
    return {type:'mc', prompt, choices:shuffle([...choices]), answer:answerStr};
  }
  if(t===2){
    const price1=(randInt(150,999)/100), price2=(randInt(150,999)/100);
    const val=Math.round((price1+price2)*100)/100; const answerStr=val.toFixed(2);
    const choices=new Set([answerStr]);
    addNumDistractor(choices,val,val+0.1,2); addNumDistractor(choices,val,val-0.1,2); addNumDistractor(choices,val,val+0.01,2);
    let tries=0; while(choices.size<4 && tries<30){tries++; addNumDistractor(choices,val,val+randInt(-20,20)/100,2);}
    const prompt = LANG==='en'
      ? `At the pool snack bar, Sofia buys a popsicle for $${price1.toFixed(2)} and lemonade for $${price2.toFixed(2)}. How much did she spend in total?`
      : `En la tienda de la alberca, Sofia compra una paleta por $${price1.toFixed(2)} y limonada por $${price2.toFixed(2)}. ¿Cuánto gastó en total?`;
    return {type:'mc', prompt, choices:shuffle([...choices]), answer:answerStr};
  }
  const l=randInt(2,8), w=randInt(2,8), h=randInt(2,8), V=l*w*h;
  const prompt = LANG==='en'
    ? `Webster the spider is spinning a box-shaped web frame that is ${l} in. long, ${w} in. wide, and ${h} in. tall. What is the volume of the frame?`
    : `Webster la araña está tejiendo un marco de telaraña en forma de caja que mide ${l} in. de largo, ${w} in. de ancho y ${h} in. de alto. ¿Cuál es el volumen del marco?`;
  return mcQuestionInt(prompt, V);
}
// clean, guaranteed-divisible version overriding the messy branch above
function genWordDivision(){
  const b=randInt(3,9), q=randInt(4,12), a=b*q;
  const prompt = LANG==='en'
    ? `At the pool, ${a} kids split evenly into ${b} swim lanes. How many kids are in each lane?`
    : `En la alberca, ${a} niños se dividen en partes iguales en ${b} carriles de natación. ¿Cuántos niños hay en cada carril?`;
  return mcQuestionInt(prompt, q);
}

function levelFromXP(xp){ return Math.floor(xp/120)+1; }
function xpIntoLevel(xp){ return xp % 120; }

/* ---- Play-time tracking ---- */
let sessionStartTs = Date.now();
let totalSecondsBase = 0;
function getSessionSeconds(){ return Math.max(0, Math.floor((Date.now()-sessionStartTs)/1000)); }
function getTotalSeconds(){ return totalSecondsBase + getSessionSeconds(); }
function formatDuration(totalSec){
  totalSec = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}

async function saveProgress(){
  try{
    localStorage.setItem('mathquest_progress', JSON.stringify({
      name:state.name, xp:state.xp, coins:state.coins, bestStars:state.bestStars, lang:LANG,
      totalSeconds:getTotalSeconds()
    }));
  }catch(e){ /* storage unavailable (private browsing, etc.) — continue silently */ }
}
async function loadProgress(){
  try{
    const raw = localStorage.getItem('mathquest_progress');
    if(raw){
      const d = JSON.parse(raw);
      state.name = d.name || '';
      state.xp = d.xp || 0;
      state.coins = d.coins || 0;
      state.bestStars = d.bestStars || {};
      LANG = d.lang === 'es' ? 'es' : 'en';
      totalSecondsBase = d.totalSeconds || 0;
    }
  }catch(e){ /* no saved progress yet */ }
}

function wireHUD(){
  const btn = document.getElementById('langToggle');

}
let statsInterval = null;
function closeStatsPanel(){
  const existing = document.getElementById('statsPanelEl');
  if(existing) existing.remove();
  if(statsInterval){ clearInterval(statsInterval); statsInterval=null; }
}
function toggleStatsPanel(){
  if(document.getElementById('statsPanelEl')){ closeStatsPanel(); return; }
  const panel = document.createElement('div');
  panel.id = 'statsPanelEl';
  panel.className = 'stats-panel';
  document.body.appendChild(panel);
  const update = ()=>{
    panel.innerHTML = `
      <div class="stats-title">⏱️ ${LANG==='en'?'Time Played':'Tiempo Jugado'}</div>
      <div class="row"><span>${L('session')}</span><b>${formatDuration(getSessionSeconds())}</b></div>
      <div class="row"><span>${L('allTime')}</span><b>${formatDuration(getTotalSeconds())}</b></div>
      <button class="chunky c-purple stats-close" id="statsCloseBtn">${L('close')}</button>
    `;
    const closeBtn = document.getElementById('statsCloseBtn');
    if(closeBtn) closeBtn.addEventListener('click', closeStatsPanel);
  };
  update();
  statsInterval = setInterval(update, 1000);
}
async function toggleLanguage(){
  LANG = LANG==='en' ? 'es' : 'en';
  if(state.screen==='game' && state.currentQ){
    const topic = topicOf();
    state.currentQ = topic.gen();
    state.answered = false;
    state.selected = null;
    state.plotPick = null;
  }
  await saveProgress();
  render();
}

        <p class="tsub">${tx.subtitle}</p>
        <p class="tdesc">${tx.desc}</p>
        <button class="chunky c-${t.color} tile-play" data-topic="${t.id}">${L('play')}</button>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="hub-header">
    <div class="hub-header-inner">
      <div class="plush-hero">${plushSVG()}</div>
      <div>
        <h2 class="blocky-text">${L('chooseWorld')}</h2>
        <p>${L('chooseWorldSub')}</p>
      </div>
    </div>
  </div>
  <div class="tile-grid">${tiles}</div>
  <div class="spider-corner" id="spiderCorner" title="${L('spiderTitle')}">🕷️</div>`;
}
const SPIDER_LINES = {
  en:["It's just me, Webster! I live in Webster's Web Grid 🕸️","Hi Sofia! Come find me in the Grid world!","I found a great spot on the wall over here 🕷️","Webster says: coordinate grids are just fancy webs!"],
  es:["¡Solo soy yo, Webster! Vivo en La Telaraña de Webster 🕸️","¡Hola Sofia! ¡Ven a buscarme en el mundo de la Cuadrícula!","Encontré un buen lugar en la pared por aquí 🕷️","Webster dice: ¡los planos cartesianos son solo telarañas elegantes!"]
};
function wireHub(){
  document.querySelectorAll('[data-topic]').forEach(el=>{
    el.addEventListener('click', ()=>{
      startRound(el.getAttribute('data-topic'));
    });
  });
  const spider = document.getElementById('spiderCorner');
  if(spider){
    spider.addEventListener('click', ()=>{
      const existing = document.querySelector('.spider-toast');
      if(existing) existing.remove();
      const t = document.createElement('div');
      t.className='spider-toast';
      const lines = SPIDER_LINES[LANG];
      t.textContent = lines[randInt(0,lines.length-1)];
      document.body.appendChild(t);
      setTimeout(()=>t.remove(), 2600);
    });
  }
}

function startRound(topicId){
  state.topicId = topicId;
  state.qIndex = 0;
  state.correct = 0;
  state.streak = 0;
  state.roundCoins = 0;
  state.roundXP = 0;
  state.answered = false;
  state.selected = null;
  state.plotPick = null;
  const topic = TOPICS.find(t=>t.id===topicId);
  state.currentQ = topic.gen();
  state.screen = 'game';
  render();
}

function topicOf(){ return TOPICS.find(t=>t.id===state.topicId); }

function renderProgressDots(){
  let dots='';
  for(let i=0;i<ROUND_LEN;i++){
    let cls='pdot';
    if(i<state.qIndex) cls+=' done';
    else if(i===state.qIndex) cls+=' current';
    dots+=`<span class="${cls}"></span>`;
  }
  return dots;
}

function renderMiniGridSVG(x,y){
  const size=180, cell=size/10;
  let dots='';
  for(let gx=0; gx<=9; gx++){
    for(let gy=0; gy<=9; gy++){
      dots += `<circle cx="${gx*cell+cell/2}" cy="${size-(gy*cell+cell/2)}" r="1.6" fill="#D9D0FF"/>`;
    }
  }
  const px = x*cell+cell/2, py = size-(y*cell+cell/2);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:var(--purple-l); border-radius:14px;">
    <line x1="0" y1="${size-cell/2}" x2="${size}" y2="${size-cell/2}" stroke="#B9ACFF" stroke-width="1.5"/>
    <line x1="${cell/2}" y1="0" x2="${cell/2}" y2="${size}" stroke="#B9ACFF" stroke-width="1.5"/>
    ${dots}
    <circle cx="${px}" cy="${py}" r="7" fill="#FF5DA2" stroke="#fff" stroke-width="2"/>
  </svg>`;
}

function renderPlotGrid(){
  let cells='';
  for(let y=9; y>=0; y--){
    for(let x=0; x<=9; x++){
      let cls='plot-cell';
      if(x===0&&y===0) cls+=' origin';
      if(state.answered){
        const isTarget = x===state.currentQ.target.x && y===state.currentQ.target.y;
        const isPicked = state.plotPick && x===state.plotPick.x && y===state.plotPick.y;
        if(isTarget) cls += (state.plotPick && state.plotPick.x===x && state.plotPick.y===y) ? ' picked-correct' : ' reveal';
        else if(isPicked) cls += ' picked-wrong';
      }
      cells += `<button class="${cls}" data-x="${x}" data-y="${y}" aria-label="(${x}, ${y})"></button>`;
    }
  }
  return `<div class="plot-grid">${cells}</div>`;
}

function renderGame(){
  const topic = topicOf();
  const q = state.currentQ;
  let body = '';

  if(q.type==='mc' || q.type==='grid-identify'){
    const gridVisual = q.type==='grid-identify' ? `<div class="mini-grid-wrap">${renderMiniGridSVG(q.target.x,q.target.y)}</div>` : '';
    const cols = q.choices.length<=2 ? 'two' : '';
    const btns = q.choices.map(c=>{
      let cls='choice-btn';
      if(state.answered){
        if(c===q.answer) cls+=' correct';
        else if(c===state.selected) cls+=' wrong';
      }
      return `<button class="${cls}" data-choice="${esc(c)}" ${state.answered?'disabled':''}>${esc(c)}</button>`;
    }).join('');
    body = `
      <p class="q-prompt">${esc(q.prompt)}</p>
      ${gridVisual}
      <div class="choices-grid ${cols}">${btns}</div>
    `;
  } else if(q.type==='grid-plot'){
    body = `
      <p class="q-prompt">${esc(q.prompt)}</p>
      ${renderPlotGrid()}
    `;
  }

  let feedback = '';
  if(state.answered){
    const wasRight = (q.type==='grid-plot') ? (state.plotPick && state.plotPick.x===q.target.x && state.plotPick.y===q.target.y)
                      : (state.selected===q.answer);
    feedback = `<div class="feedback-row ${wasRight?'ok':'bad'}">${wasRight? pickPraise() : L('wrongFeedback')}</div>
      <button class="chunky c-purple next-btn" id="nextBtn">${state.qIndex+1>=ROUND_LEN? L('seeResults') : L('nextQuestion')}</button>`;
  } else {
    feedback = `<div class="feedback-row"></div>`;
  }

  return `
  <div class="game-wrap">
    <div class="game-topbar">
      <button class="back-link" id="backBtn">${L('backHub')}</button>
      <div class="progress-dots">${renderProgressDots()}</div>
      <div class="streak-chip">🔥 ${state.streak}</div>
    </div>
    <div class="q-card">
      <div style="font-family:'Baloo 2'; font-size:13px; color:var(--ink-soft); font-weight:800; margin-bottom:10px;">
        ${topic.icon} ${topicText(topic.id).name.toUpperCase()} · ${L('qLabel')}${state.qIndex+1} ${L('of')} ${ROUND_LEN}
      </div>
      ${body}
      ${feedback}
    </div>
  </div>`;
}

function pickPraise(){
  const opts = LANG==='en'
    ? ['¡Wow wow! Wow Wow is so proud! 🐶','Correct! Wow Wow does a happy spin! 🐾','Nice work! 🎉','Yes! Perfect. ⭐','Fetch! Got it! 🎾','Webster approves! 🕸️']
    : ['¡Wow wow! ¡Wow Wow está muy orgulloso! 🐶','¡Correcto! ¡Wow Wow da vueltas de alegría! 🐾','¡Buen trabajo! 🎉','¡Sí! Perfecto. ⭐','¡A buscarla! ¡La tienes! 🎾','¡Webster lo aprueba! 🕸️'];
  return opts[randInt(0,opts.length-1)];
}

function spawnFloatPop(text, x, y, color){
  const el = document.createElement('div');
  el.className='float-pop';
  el.textContent = text;
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.style.color = color;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

function wireGame(){
  document.getElementById('backBtn').addEventListener('click', ()=>{ state.screen='hub'; render(); });

  if(state.currentQ.type==='grid-plot' && !state.answered){
    document.querySelectorAll('.plot-cell').forEach(cell=>{
      cell.addEventListener('click', (e)=>{
        const x = parseInt(cell.getAttribute('data-x'));
        const y = parseInt(cell.getAttribute('data-y'));
        state.plotPick = {x,y};
        answerQuestion(x===state.currentQ.target.x && y===state.currentQ.target.y, e);
      });
    });
  } else if(!state.answered){
    document.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const val = btn.getAttribute('data-choice');
        state.selected = val;
        answerQuestion(val===state.currentQ.answer, e);
      });
    });
  }

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', nextQuestion);
}

function answerQuestion(isCorrect, evt){
  state.answered = true;
  const rect = evt.target.getBoundingClientRect();
  if(isCorrect){
    state.correct++;
    state.streak++;
    const bonus = Math.min(state.streak*2, 20);
    const coinsGained = 10 + bonus;
    const xpGained = 15;
    state.coins += coinsGained;
    state.roundCoins += coinsGained;
    state.roundXP += xpGained;
    const prevLevel = levelFromXP(state.xp);
    state.xp += xpGained;
    spawnFloatPop(`+${coinsGained} 🦴`, rect.left+rect.width/2-20, rect.top-10, '#FFC93C');
    const newLevel = levelFromXP(state.xp);
    if(newLevel>prevLevel){ showLevelUp(newLevel); }
  } else {
    state.streak = 0;
    state.coins += 2;
    state.roundCoins += 2;
    state.xp += 3;
    state.roundXP += 3;
  }
  render();
  saveProgress();
}

function showLevelUp(lvl){
  setTimeout(()=>{
    const t = document.createElement('div');
    t.className='levelup-toast';
    t.textContent = LANG==='en' ? `🎉 Level Up! You're now Level ${lvl}!` : `🎉 ¡Subiste de Nivel! ¡Ahora eres Nivel ${lvl}!`;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
  }, 50);
}

function nextQuestion(){
  state.qIndex++;
  if(state.qIndex>=ROUND_LEN){
    finishRound();
    return;
  }
  const topic = topicOf();
  state.currentQ = topic.gen();
  state.answered = false;
  state.selected = null;
  state.plotPick = null;
  render();
}

function finishRound(){
  const acc = state.correct / ROUND_LEN;
  let stars = 1;
  if(acc>=0.9) stars=3; else if(acc>=0.65) stars=2; else stars=1;
  const prevBest = state.bestStars[state.topicId] || 0;
  if(stars>prevBest) state.bestStars[state.topicId] = stars;
  state.screen='summary';
  render();
  saveProgress();
}

function renderSummary(){
  const topic = topicOf();
  const tx = topicText(topic.id);
  const acc = state.correct/ROUND_LEN;
  let earnedStars = acc>=0.9?3:acc>=0.65?2:1;
  const starDisplay = '⭐'.repeat(earnedStars)+'☆'.repeat(3-earnedStars);
  const completeTitle = LANG==='en' ? `${tx.name} Complete!` : `¡${tx.name} Completado!`;
  return `
  <div class="summary-card">
    <div style="font-size:44px;">${topic.icon}</div>
    <h2 style="margin:6px 0 0;">${completeTitle}</h2>
    <div class="stars-row">${starDisplay}</div>
    <div class="summary-stats">
      <div class="stat-box"><div class="num">${state.correct}/${ROUND_LEN}</div><div class="lbl">${L('correctStat')}</div></div>
      <div class="stat-box"><div class="num">+${state.roundCoins}</div><div class="lbl">${L('bonesStat')}</div></div>
      <div class="stat-box"><div class="num">+${state.roundXP}</div><div class="lbl">${L('xpStat')}</div></div>
    </div>
    <div class="summary-btns">
      <button class="chunky c-${topic.color}" id="againBtn">${L('playAgain')}</button>
      <button class="chunky c-purple" id="hubBtn">${L('backToHub')}</button>
    </div>
  </div>`;
}
function wireSummary(){
  document.getElementById('againBtn').addEventListener('click', ()=>startRound(state.topicId));
  document.getElementById('hubBtn').addEventListener('click', ()=>{ state.screen='hub'; render(); });
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadProgress();
  state.name = 'Sofia Villarreal Castañeda';
  state.screen = 'hub';
  render();
  setInterval(saveProgress, 20000);
  window.addEventListener('pagehide', ()=>{ saveProgress(); });
})();
</script>
</body>
</html>
