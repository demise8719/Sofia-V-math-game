<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sofia Villarreal Castañeda's Math Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6C5CE7; --purple-d:#4A3BB0; --purple-l:#EFEBFF;
  --pink:#FF5DA2;   --pink-d:#D63F82;   --pink-l:#FFEAF3;
  --teal:#00D9C0;   --teal-d:#00A896;   --teal-l:#E3FFFB;
  --gold:#FFC93C;   --gold-d:#E0A800;   --gold-l:#FFF6DE;
  --blue:#4FC3F7;   --blue-d:#1E9FDB;   --blue-l:#E6F8FF;
  --green:#6EE7A8;  --green-d:#2FBE7A;  --green-l:#E7FFF2;
  --orange:#FF9F5A; --orange-d:#E67A2E; --orange-l:#FFF1E6;
  --coral:#FF6F6F;  --coral-d:#E24D4D;  --coral-l:#FFE9E9;
  --crystal-gold:#FFD866; --crystal-red:#E84A5F;
  --ink:#241B45; --ink-soft:#6A5F99;
  --bg1:#1B1035; --bg2:#2E1E5E;
  --panel:#FFFFFF;
  --ok:#2FBE7A; --bad:#FF5A6E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  background:
    radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.5) 100%, transparent),
    radial-gradient(1.5px 1.5px at 130px 80px, rgba(255,255,255,.35) 100%, transparent),
    radial-gradient(2px 2px at 60px 140px, rgba(255,255,255,.4) 100%, transparent),
    radial-gradient(1.5px 1.5px at 200px 60px, rgba(255,255,255,.3) 100%, transparent),
    radial-gradient(1.5px 1.5px at 240px 180px, rgba(255,255,255,.4) 100%, transparent),
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 42px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 42px),
    linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg1));
  background-size: 260px 260px, 260px 260px, 260px 260px, 260px 260px, 260px 260px, 42px 42px, 42px 42px, 100% 100%;
  min-height:100vh;
  color:var(--ink);
}
.blocky-text{
  color:#fff; text-shadow:
    -2px -2px 0 rgba(0,0,0,.5), 2px -2px 0 rgba(0,0,0,.5),
    -2px 2px 0 rgba(0,0,0,.5), 2px 2px 0 rgba(0,0,0,.5),
    0 4px 0 rgba(0,0,0,.3);
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
button{font-family:inherit;}
#app{max-width:900px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}

/* ---------- chunky pressable button ---------- */
.chunky{
  border:none; border-radius:16px; cursor:pointer;
  font-family:'Baloo 2',sans-serif; font-weight:700; color:#fff;
  padding:14px 22px; font-size:17px;
  transition:transform .06s ease, box-shadow .06s ease;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.chunky:active{transform:translateY(5px);}
.chunky:focus-visible{outline:3px solid #fff; outline-offset:2px;}
.c-purple{background:var(--purple); box-shadow:0 5px 0 var(--purple-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-purple:active{box-shadow:0 0 0 var(--purple-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-pink{background:var(--pink); box-shadow:0 5px 0 var(--pink-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-pink:active{box-shadow:0 0 0 var(--pink-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-teal{background:var(--teal); box-shadow:0 5px 0 var(--teal-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-teal:active{box-shadow:0 0 0 var(--teal-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-gold{background:var(--gold); box-shadow:0 5px 0 var(--gold-d), inset 0 2px 0 rgba(255,255,255,.5); color:#4A3200;}
.c-gold:active{box-shadow:0 0 0 var(--gold-d), inset 0 2px 0 rgba(255,255,255,.5);}
.c-blue{background:var(--blue); box-shadow:0 5px 0 var(--blue-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-blue:active{box-shadow:0 0 0 var(--blue-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-green{background:var(--green); box-shadow:0 5px 0 var(--green-d), inset 0 2px 0 rgba(255,255,255,.4); color:#0B4A2C;}
.c-green:active{box-shadow:0 0 0 var(--green-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-orange{background:var(--orange); box-shadow:0 5px 0 var(--orange-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-orange:active{box-shadow:0 0 0 var(--orange-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-coral{background:var(--coral); box-shadow:0 5px 0 var(--coral-d), inset 0 2px 0 rgba(255,255,255,.4);}
.c-coral:active{box-shadow:0 0 0 var(--coral-d), inset 0 2px 0 rgba(255,255,255,.4);}

/* ---------- HUD ---------- */
#hud{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 18px; margin-bottom:6px;
  background:rgba(27,16,53,.72); backdrop-filter:blur(10px);
  border-bottom:2px solid rgba(255,255,255,.08);
}
.avatar-badge{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(145deg,var(--gold-l),var(--orange-l));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0; box-shadow:0 3px 0 rgba(0,0,0,.25); overflow:hidden;
}
.avatar-badge svg{width:56px;height:56px;}
.hud-name{color:#fff;font-weight:800;font-size:14px;line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px;}
.hud-sub{color:#C9BFFF;font-size:12px;font-weight:700;}
.level-badge{
  background:linear-gradient(180deg, #FFE18A, var(--gold)); color:#4A3200; font-family:'Baloo 2';
  font-weight:800; font-size:12px; border-radius:20px; padding:2px 9px;
  display:inline-block; margin-top:2px; border:2px solid var(--gold-d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
.xp-wrap{flex:1; min-width:60px;}
.xp-bar-bg{height:10px;border-radius:6px;background:rgba(255,255,255,.15); overflow:hidden;}
.xp-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--blue)); transition:width .4s ease;}
.coin-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,201,60,.15); border:2px solid var(--gold);
  border-radius:20px; padding:5px 12px; color:#FFE9A8; font-weight:800; font-size:14px;
  flex-shrink:0; box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.lang-toggle{
  flex-shrink:0; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.1);
  color:#fff; border-radius:16px; padding:6px 11px; font-family:'Baloo 2'; font-weight:800;
  font-size:12px; cursor:pointer; display:flex; align-items:center; gap:4px;
}
.lang-toggle:active{transform:translateY(2px);}

.stats-panel{
  position:fixed; top:70px; right:16px; background:#fff; color:var(--ink); border-radius:16px;
  padding:16px 18px; box-shadow:0 10px 24px rgba(0,0,0,.4); z-index:60; font-family:'Baloo 2';
  min-width:190px; border:3px solid rgba(36,27,69,.14); animation:popIn .3s ease;
}
.stats-panel .stats-title{font-size:13px; color:var(--ink-soft); font-weight:800; text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.stats-panel .row{display:flex; justify-content:space-between; align-items:baseline; gap:14px; font-size:14px; margin:6px 0;}
.stats-panel .row span{color:var(--ink-soft); font-weight:700;}
.stats-panel .row b{color:var(--purple); font-size:17px;}
.stats-close{margin-top:10px; width:100%; padding:9px; font-size:13px;}

/* ---------- Name screen ---------- */
.center-screen{min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
.rocket-emoji{font-size:64px; margin-bottom:6px; animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.title-hero{color:#fff; font-size:44px; margin:0; letter-spacing:.5px;}
.title-hero span{color:var(--gold);}
.subtitle-hero{color:#C9BFFF; font-size:16px; margin:8px 0 28px; max-width:360px;}
#nameInput{
  font-family:'Baloo 2'; font-size:20px; padding:14px 18px; border-radius:16px;
  border:3px solid var(--purple); width:260px; text-align:center; margin-bottom:18px;
  outline:none;
}
#nameInput:focus{border-color:var(--pink);}

/* ---------- Hub ---------- */
.hub-header{padding:6px 20px 4px;}
.section-title{margin:0 0 2px; font-size:22px; color:#fff; font-family:'Baloo 2'; font-weight:700;}
.section-sub{color:#C9BFFF; margin:0; font-size:13.5px; max-width:420px;}

/* Pet stage — the showcase hero for the avatar-building experience */
.pet-stage{
  position:relative; margin:16px 20px 14px; padding:26px 20px 20px;
  border-radius:28px; overflow:hidden; text-align:center;
  background:linear-gradient(165deg, #2E2158 0%, #251A47 60%, #1E1440 100%);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
.pet-stage-glow{
  position:absolute; top:-30px; left:50%; transform:translateX(-50%);
  width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,201,60,.28) 0%, transparent 70%);
  pointer-events:none;
}
.pet-stage-figure{position:relative; animation:float 4.5s ease-in-out infinite;}
.pet-stage-figure svg{width:150px; height:auto; display:inline-block; filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));}
.pet-stage-info{margin-top:4px;}
.pet-stage-name{font-family:'Baloo 2'; font-weight:800; font-size:19px; color:#fff;}
.pet-stage-badge{
  display:inline-block; margin-top:3px; padding:3px 12px; border-radius:20px;
  background:rgba(255,201,60,.16); border:1px solid rgba(255,201,60,.4);
  color:#FFD866; font-family:'Baloo 2'; font-weight:700; font-size:12px;
}
.pet-stage-actions{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
.hub-secondary-row{display:flex; gap:9px; justify-content:center; margin:0 20px 18px; flex-wrap:wrap;}

/* Softer, more refined pill buttons for the avatar/pet experience */
.pill-btn{
  border:none; border-radius:999px; padding:11px 18px; font-family:'Baloo 2'; font-weight:700;
  font-size:13.5px; cursor:pointer; color:#fff; background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14); transition:transform .12s ease, background .15s ease;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.pill-btn:active{transform:translateY(2px) scale(.98);}
.pill-btn-primary{
  background:linear-gradient(135deg, var(--purple), #8B6FE8); border-color:transparent;
  box-shadow:0 6px 16px rgba(108,92,231,.45);
}
.pill-btn-ghost{background:rgba(255,255,255,.06); color:#C9BFFF;}
.pill-btn-ghost:hover{background:rgba(255,255,255,.12); color:#fff;}

.tile-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px; padding:18px 20px 30px;
}
.tile{
  background:var(--panel); border-radius:20px; overflow:hidden;
  border:1px solid rgba(36,27,69,.08);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  transition:transform .15s ease, box-shadow .15s ease;
  display:flex; flex-direction:column;
}
.tile:hover{transform:translateY(-4px); box-shadow:0 10px 24px rgba(0,0,0,.25);}
.tile-top{
  height:110px; display:flex; align-items:center; justify-content:center;
  font-size:52px; position:relative;
  border-bottom:1px solid rgba(0,0,0,.08);
}
.tile-top .stars{position:absolute; bottom:8px; right:10px; font-size:13px; letter-spacing:1px;}
.tile-body{padding:14px 16px 16px;}
.tile-body h3{margin:0 0 2px; font-size:17px; color:var(--ink);}
.tile-body .tsub{margin:0 0 10px; font-size:12.5px; color:var(--ink-soft); font-weight:700;}
.tile-body .tdesc{margin:0 0 14px; font-size:13px; color:#7c72a3; line-height:1.35;}
.tile-play{width:100%; text-align:center; padding:11px; font-size:15px;}

/* ---------- Game screen ---------- */
.game-wrap{padding:18px 20px 40px;}
.game-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; color:#fff;}
.back-link{background:none;border:none;color:#C9BFFF;font-weight:800;font-family:'Baloo 2';cursor:pointer;font-size:14px;display:flex;align-items:center;gap:4px;}
.progress-dots{display:flex;gap:6px;}
.pdot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);}
.pdot.done{background:var(--teal);}
.pdot.current{background:var(--gold); transform:scale(1.3);}
.streak-chip{display:flex;align-items:center;gap:4px;background:rgba(255,159,90,.18);border:2px solid var(--orange);border-radius:16px;padding:3px 10px;font-weight:800;color:#FFD9B8;font-size:13px;}

.q-card{
  background:var(--panel); border-radius:22px; padding:32px 26px;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 10px 0 rgba(0,0,0,.25), 0 18px 30px rgba(0,0,0,.35);
  text-align:center;
}
.q-prompt{font-family:'Baloo 2'; font-size:26px; color:var(--ink); margin:0 0 22px; line-height:1.3;}
.choices-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.choices-grid.two{grid-template-columns:1fr 1fr;}
@media (max-width:480px){.q-prompt{font-size:21px;} .choices-grid{grid-template-columns:1fr;}}
.choice-btn{
  border-radius:14px; border:none; padding:18px 10px; font-family:'Baloo 2';
  font-weight:700; font-size:19px; cursor:pointer; background:var(--purple-l); color:var(--purple-d);
  box-shadow:0 5px 0 #D9D0FF, inset 0 2px 0 rgba(255,255,255,.7); transition:transform .06s ease, box-shadow .06s ease, background .15s;
}
.choice-btn:active{transform:translateY(4px); box-shadow:0 1px 0 #D9D0FF, inset 0 2px 0 rgba(255,255,255,.7);}
.choice-btn.correct{background:var(--green); color:#0B4A2C; box-shadow:0 5px 0 var(--green-d), inset 0 2px 0 rgba(255,255,255,.5);}
.choice-btn.wrong{background:#FFD3D8; color:#8A1F2E; box-shadow:0 5px 0 var(--bad), inset 0 2px 0 rgba(255,255,255,.5);}
.choice-btn:disabled{cursor:default;}
.feedback-row{min-height:34px; margin-top:16px; font-family:'Baloo 2'; font-weight:700; font-size:16px;}
.feedback-row.ok{color:var(--ok);}
.feedback-row.bad{color:var(--bad);}
.next-btn{margin-top:14px;}

/* mini grid visual (identify) */
.mini-grid-wrap{display:flex; justify-content:center; margin-bottom:18px;}

/* interactive plot grid */
.plot-grid{
  display:grid; grid-template-columns:repeat(10, 1fr); gap:2px;
  max-width:340px; margin:0 auto 18px; background:var(--purple-l); padding:6px; border-radius:14px;
}
.plot-cell{
  aspect-ratio:1/1; background:#fff; border-radius:4px; cursor:pointer; border:none;
  transition:background .1s;
}
.plot-cell:hover{background:var(--purple-l);}
.plot-cell.origin{background:#EDE9FF;}
.plot-cell.picked-correct{background:var(--green);}
.plot-cell.picked-wrong{background:var(--bad);}
.plot-cell.reveal{background:var(--gold);}

/* ---------- Summary ---------- */
.summary-card{
  background:var(--panel); border-radius:22px; padding:34px 26px; text-align:center;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 10px 0 rgba(0,0,0,.25), 0 18px 30px rgba(0,0,0,.35); margin:30px 20px;
}
.stars-row{font-size:42px; margin:10px 0 18px; letter-spacing:6px;}
.summary-stats{display:flex; justify-content:center; gap:26px; margin:18px 0 26px;}
.stat-box{font-family:'Baloo 2';}
.stat-box .num{font-size:26px; color:var(--purple);}
.stat-box .lbl{font-size:12px; color:var(--ink-soft); font-weight:800; text-transform:uppercase;}
.summary-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

/* floating +xp / +coin popup */
.float-pop{
  position:fixed; font-family:'Baloo 2'; font-weight:800; font-size:18px; pointer-events:none;
  z-index:50; animation:floatUp 1s ease forwards;
}
@keyframes floatUp{0%{opacity:0; transform:translateY(0) scale(.8);}15%{opacity:1; transform:translateY(-6px) scale(1.05);}100%{opacity:0; transform:translateY(-60px) scale(1);}}

.levelup-toast{
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,var(--gold),var(--orange)); color:#4A3200;
  font-family:'Baloo 2'; font-weight:800; padding:12px 22px; border-radius:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.4); z-index:60; animation:popIn .5s ease;
}
@keyframes popIn{0%{opacity:0; transform:translate(-50%,-20px) scale(.7);}60%{opacity:1; transform:translate(-50%,4px) scale(1.05);}100%{transform:translate(-50%,0) scale(1);}}

.sr-only{position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0);}

/* ---------- Examples screen ---------- */
.example-wrap{padding:18px 20px 40px;}
.example-card{
  background:var(--panel); border-radius:22px; padding:26px 24px; margin-bottom:16px;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 8px 0 rgba(0,0,0,.25), 0 14px 24px rgba(0,0,0,.35);
}
.example-card .ex-label{font-family:'Baloo 2'; font-weight:800; font-size:12px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px;}
.example-card .ex-problem{font-family:'Baloo 2'; font-size:19px; color:var(--ink); margin:0 0 10px;}
.example-card .ex-solution{background:var(--purple-l); border-radius:14px; padding:12px 16px; font-size:14.5px; color:var(--ink); line-height:1.5;}
.example-card .ex-solution b{color:var(--purple-d);}
.example-actions{display:flex; justify-content:center; margin-top:8px;}

/* ---------- Reading Cove ---------- */
.story-card{
  background:var(--panel); border-radius:20px; overflow:hidden; margin-bottom:16px;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 7px 0 rgba(0,0,0,.25), 0 12px 20px rgba(0,0,0,.35);
  display:flex; align-items:center; gap:14px; padding:16px;
}
.story-card .story-icon{font-size:38px; flex-shrink:0;}
.story-card .story-info{flex:1;}
.story-card h3{margin:0 0 3px; font-size:17px; color:var(--ink);}
.story-card p{margin:0; font-size:13px; color:#7c72a3; line-height:1.35;}
.story-reader{
  background:var(--panel); border-radius:22px; padding:28px 26px;
  border:3px solid rgba(36,27,69,.14);
  box-shadow:0 8px 0 rgba(0,0,0,.25), 0 14px 24px rgba(0,0,0,.35);
}
.story-reader h2{margin:0 0 14px; font-size:24px; color:var(--ink);}
.story-reader .story-text{font-size:15.5px; line-height:1.75; color:var(--ink); white-space:pre-line;}
.story-reader .story-text p{margin:0 0 14px;}
.reader-actions{display:flex; justify-content:center; margin-top:20px;}
.more-stories{
  margin-top:8px; padding:16px 18px; background:rgba(255,255,255,.08); border-radius:18px;
  border:2px dashed rgba(255,255,255,.25);
}
.more-stories h4{color:#fff; margin:0 0 8px; font-size:14px; font-family:'Baloo 2';}
.more-stories a{
  display:block; color:#C9BFFF; font-weight:700; font-size:13.5px; text-decoration:none;
  padding:6px 0; border-bottom:1px solid rgba(255,255,255,.1);
}
.more-stories a:last-child{border-bottom:none;}
.more-stories a:hover{color:#fff;}
.reading-tabs{display:flex; gap:10px; margin-bottom:16px;}
.reading-tab{
  flex:1; border:none; border-radius:14px; padding:11px; font-family:'Baloo 2'; font-weight:800;
  font-size:14px; cursor:pointer; background:rgba(255,255,255,.1); color:#C9BFFF;
  border:2px solid rgba(255,255,255,.2);
}
.reading-tab.active{background:var(--coral); color:#fff; border-color:var(--coral-d);}

/* ---------- Webster help bot ---------- */
.webster-bot{
  position:fixed; bottom:16px; right:16px; width:58px; height:58px; border-radius:50%;
  background:linear-gradient(150deg, var(--green), var(--green-d)); cursor:pointer; z-index:40;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 0 var(--green-d), 0 10px 18px rgba(0,0,0,.4);
  animation:spiderWiggle 4s ease-in-out infinite; border:3px solid rgba(255,255,255,.6);
}
.webster-bot:active{transform:translateY(4px); box-shadow:0 2px 0 var(--green-d), 0 6px 12px rgba(0,0,0,.4);}
.webster-bot svg{width:38px; height:38px;}
.webster-bot .ping-dot{
  position:absolute; top:-3px; right:-3px; width:14px; height:14px; border-radius:50%;
  background:var(--gold); border:2px solid #fff;
}
.webster-panel{
  position:fixed; bottom:82px; right:16px; max-width:270px; background:#fff; color:var(--ink);
  border-radius:16px; padding:16px 18px; box-shadow:0 10px 24px rgba(0,0,0,.4); z-index:41;

<script>
/* ============================================================
   HELPERS
   ============================================================ */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function lcm(a,b){return (a*b)/gcd(a,b);}
function simplifyFrac(n,d){if(n===0)return[0,1];const g=gcd(n,d);return[n/g,d/g];}
function fracStr(n,d){d=Math.round(d);n=Math.round(n);if(d===1)return `${n}`;if(d<0){d=-d;n=-n;}return `${n}/${d}`;}
function fracVal(s){ if(String(s).includes('/')){const[n,d]=String(s).split('/').map(Number); return n/d;} return Number(s); }
function addDistractor(choices, answerVal, candidate){
  if(String(candidate).includes('/')){
    const [n,d]=String(candidate).split('/').map(Number);
    if(d<=0 || n<0) return;
  } else if(Number(candidate)<0) return;
  const cVal = fracVal(candidate);
  if(Math.abs(cVal-answerVal) < 1e-9) return;
  for(const existing of choices){ if(Math.abs(fracVal(existing)-cVal) < 1e-9) return; }
  choices.add(candidate);
}
function addNumDistractor(choices, answerVal, candidate, decimals){
  const key = Number(candidate).toFixed(decimals);
  if(Math.abs(Number(key)-answerVal) < Math.pow(10,-decimals)/2) return;
  for(const existing of choices){ if(existing===key) return; }
  choices.add(key);
}
function mcQuestionInt(prompt, answer, spread){
  spread = spread || Math.max(2, Math.round(Math.abs(answer)*0.2)+1);
  const choices = new Set([answer]);
  let tries=0;
  while(choices.size<4 && tries<50){
    tries++;
    const d = answer + randInt(-spread, spread);
    if(d>=0 && d!==answer) choices.add(d);
  }
  while(choices.size<4) choices.add(answer+choices.size+1);
  return {type:'mc', prompt, choices: shuffle([...choices]).map(String), answer:String(answer)};
}

/* ---- Visual equip overlays: equipped items render as positioned icons on the pet (the avatar).
   Clothing that needs to actually wrap the body (pants, outfits, shoes) gets real fitted vector

function renderCatalogOverlay(itemId, catalog, positions){
  const item = catalog.find(i=>i.id===itemId);
  if(!item) return '';
  if(FITTED_SHAPES[itemId]) return FITTED_SHAPES[itemId]();
  const pos = positions[itemId] || positions._byCategory[item.cat] || positions._byCategory.accessories;
  return `<text x="${pos.x}" y="${pos.y}" font-size="${pos.size}" text-anchor="middle" dominant-baseline="middle">${item.icon}</text>`;
}

function playShopChime(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const notes = [660, 880];
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, ctx.currentTime + i*0.12);
      gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + i*0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.12 + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.12);
      osc.stop(ctx.currentTime + i*0.12 + 0.4);
    });
  }catch(e){ /* audio unavailable, continue silently */ }
}

const FRAC_DENOMS = [2,3,4,5,6,8,10];

  } else {
    const doubled = d1*2;
    if(FRAC_DENOMS.includes(doubled) && Math.random()<0.7){ d2 = doubled; }
    else if(d1%2===0 && FRAC_DENOMS.includes(d1/2)){ d2 = d1/2; }
    else { d2 = d1; }
  }
  let n1=randInt(1,d1-1), n2=randInt(1,d2-1);
  const L=lcm(d1,d2);
  let numA=n1*(L/d1), numB=n2*(L/d2);
  if(!isAdd && numA<numB){ [numA,numB]=[numB,numA]; [n1,n2]=[n2,n1]; [d1,d2]=[d2,d1]; }
  const rawNum = isAdd ? numA+numB : numA-numB;
  const [sn,sd]=simplifyFrac(rawNum,L);
  const prompt=`${n1}/${d1} ${isAdd?'+':'-'} ${n2}/${d2} = ?`;
  const answerStr=fracStr(sn,sd), answerVal=sn/sd;
  const choices=new Set([answerStr]);
  addDistractor(choices,answerVal,fracStr(rawNum,L));
  addDistractor(choices,answerVal,fracStr(isAdd? n1+n2 : Math.abs(n1-n2), d1+d2));
  let tries2=0;
  while(choices.size<4 && tries2<50){tries2++; const t=sn+randInt(-2,3); if(t>0) addDistractor(choices,answerVal,fracStr(t,sd));}
  let filler=1;
  while(choices.size<4){ addDistractor(choices,answerVal,fracStr(sn+filler,sd+filler)); filler++; if(filler>20) break; }
  return {type:'mc', prompt, choices:shuffle([...choices]), answer:answerStr};
}
function genFracMulWhole(){

  const prompt=`${n}/${d} × ${w} = ?`;
  const answerStr=fracStr(sn,sd), answerVal=sn/sd;
  const choices=new Set([answerStr]);
  addDistractor(choices,answerVal,fracStr(n*w,d));
  addDistractor(choices,answerVal,fracStr(n+w,d));
  let tries=0;
  while(choices.size<4 && tries<50){tries++; const t=sn+randInt(-2,3); if(t>0) addDistractor(choices,answerVal,fracStr(t,sd));}

  while(choices.size<4){ addDistractor(choices,answerVal,fracStr(sn+filler,sd+filler+1)); filler++; if(filler>20) break; }

function genFracCompare(){
  const d1=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)], d2=FRAC_DENOMS[randInt(0,FRAC_DENOMS.length-1)];
  let n1=randInt(1,d1-1), n2=randInt(1,d2-1);
  if(n1*d2===n2*d1) n2 = n2===d2-1? n2-1 : n2+1;

const PLACE_NAMES_I18N = { en:['ones','tenths','hundredths'], es:['unidades','décimas','centésimas'] };

/* ---- Coordinate plane ---- */
function genGrid(){
  const x=randInt(0,6), y=randInt(0,6);
  if(Math.random()<0.5){
    // identify: show marked point, choose coordinates
    const answer=`(${x}, ${y})`;
    const choices=new Set([answer]);
    const opts=[[x+1,y],[x-1,y],[x,y+1],[x,y-1],[y,x]];
    for(const [ox,oy] of shuffle(opts)){
      if(ox>=0&&ox<=9&&oy>=0&&oy<=9){ const s=`(${ox}, ${oy})`; if(s!==answer) choices.add(s); }
      if(choices.size>=4) break;
    }
    let guard=0;
    while(choices.size<4 && guard<30){ guard++; const ox=randInt(0,9), oy=randInt(0,9); const s=`(${ox}, ${oy})`; if(s!==answer) choices.add(s); }
    return {type:'grid-identify', prompt: LANG==='en' ? 'What are the coordinates of the marked point?' : '¿Cuáles son las coordenadas del punto marcado?', target:{x,y}, choices:shuffle([...choices]), answer};
  }
  const plotPrompt = LANG==='en' ? `Plot the point (${x}, ${y})` : `Traza el punto (${x}, ${y})`;
  return {type:'grid-plot', prompt:plotPrompt, target:{x,y}};
}

    text:{
      en:`Webster the spider had never seen the ocean before. He usually stayed cozy at home, spinning webs in quiet corners. But one morning, he crawled into Sofia's beach bag to nap in the shade of a towel — and before he knew it, he was at the beach!

"This is like a tiny ocean of its own," Webster whispered, amazed.

Inside the pool, an orange starfish clung to a rock, moving so slowly it barely seemed to move at all. Nearby, a small hermit crab scuttled sideways, dragging its borrowed shell like a tiny house on its back. A cluster of purple sea anemones waved their soft arms in the water, looking almost like flowers, even though they were animals.

Webster watched a little fish dart between two rocks, hiding from a curious seagull above. "Everyone here has a job," Webster thought. "The starfish is a great hunter, even if it's slow. The hermit crab always carries its home. And the anemone catches its food with those waving arms."

Webster couldn't answer in words, but if he could, he would have said: the ocean isn't just the big waves crashing on the sand. Sometimes the most amazing parts are the small, quiet pools left behind, filled with tiny creatures each doing their own important job.

That night, back home in his web, Webster spun a little faster than usual, thinking about the tide pool and all its tiny neighbors.`,
      es:`Webster la araña nunca había visto el océano. Normalmente se quedaba cómodo en casa, tejiendo telarañas en rincones tranquilos. Pero una mañana, se metió en la bolsa de playa de Sofia para dormir la siesta a la sombra de una toalla — y sin darse cuenta, ¡ya estaba en la playa!

    text:{
      en:`Sofia and Cat were floating on their backs in the ocean, looking up at the fluffy white clouds, when Cat asked, "Where do clouds come from?"

"Actually," Sofia said, "some of that cloud might have been part of this exact ocean, not long ago!"

Cat sat up, splashing. "No way!"

"It's true," Sofia said. "It's called the water cycle. Let's pretend we're a water drop and go on the journey."

Imagine you are a tiny drop of water, resting on the surface of the ocean. The sun shines down and warms you up so much that you turn into an invisible gas called water vapor. This is called evaporation. You float upward, rising higher and higher into the sky, way above the beach, way above the birds.

Up in the cool air, you bump into millions of other water vapor drops. Together, you all cool down and squeeze back into tiny drops of liquid water again. This is called condensation. All those tiny drops clump together to form a fluffy white cloud, just like the ones Cat was looking at.

The cloud drifts along, pushed by the wind, until it grows so heavy with water drops that it cannot hold them anymore. The drops fall from the sky as rain. This is called precipitation. Maybe you land in the mountains, or in a river, or right back in the ocean where you started!

If you land on a mountain, you might trickle into a stream, then a river, flowing downhill, past rocks and fish and forests, until — splash — you reach the ocean again, ready to start the whole journey all over.

"So the same water just keeps going around and around?" Cat asked.

"Forever," Sofia said. "The water we're swimming in right now might have been a cloud a hundred years ago, or rain on a mountain, or even a puddle a dinosaur splashed in!"

Cat looked at the ocean with new wonder. "That's the coolest thing I've ever heard."`,
      es:`Sofia y Cat estaban flotando boca arriba en el océano, mirando las nubes blancas y esponjosas, cuando Cat preguntó: —¿De dónde vienen las nubes?

—En realidad —dijo Sofia—, ¡parte de esa nube pudo haber sido parte de este mismo océano, hace no mucho tiempo!

Cat se sentó de golpe, salpicando agua. —¡No puede ser!

—Es verdad —dijo Sofia—. Se llama el ciclo del agua. Vamos a imaginar que somos una gota de agua y hacemos el viaje.

Imagina que eres una pequeña gota de agua, descansando en la superficie del océano. El sol brilla y te calienta tanto que te conviertes en un gas invisible llamado vapor de agua. Esto se llama evaporación. Flotas hacia arriba, subiendo cada vez más alto en el cielo, muy por encima de la playa, muy por encima de los pájaros.

Allá arriba, en el aire frío, chocas con millones de otras gotitas de vapor de agua. Juntas, todas se enfrían y se convierten de nuevo en pequeñas gotas de agua líquida. Esto se llama condensación. Todas esas gotitas se juntan para formar una nube blanca y esponjosa, como las que Cat estaba mirando.

La nube flota, empujada por el viento, hasta que se vuelve tan pesada con gotas de agua que ya no puede sostenerlas. Las gotas caen del cielo como lluvia. Esto se llama precipitación. Tal vez caes en las montañas, o en un río, ¡o de regreso en el mismo océano donde empezaste!

Si caes en una montaña, tal vez fluyas hacia un arroyo, luego un río, corriendo cuesta abajo, pasando rocas y peces y bosques, hasta que — splash — llegas de nuevo al océano, lista para empezar todo el viaje otra vez.

—¿Entonces la misma agua sigue dando vueltas y vueltas? —preguntó Cat.

—Para siempre —dijo Sofia—. El agua en la que estamos nadando ahora mismo pudo haber sido una nube hace cien años, o lluvia en una montaña, ¡o hasta un charco donde chapoteó un dinosaurio!

Cat miró el océano con nueva admiración. —Eso es lo más increíble que he escuchado.`

    text:{
      en:`Sofia couldn't find her favorite seashell anywhere. She had brought it home from the beach and set it down somewhere in the yard — but where?

"Wow Wow, can you help me find it?" Sofia asked.

Wow Wow's nose twitched. He lowered his big golden head and began sniffing the grass, moving in slow zig-zags across the yard. Within a minute, he stopped at a bush, pushed his nose into the leaves, and pulled out the shell with his teeth, tail wagging proudly.

"How did you do that so fast?" Sofia laughed, taking the shell.

Here's the secret: a dog's nose is one of the most amazing tools in the animal world. While a human has about 6 million special smelling cells inside their nose, a dog like Wow Wow has around 300 million. That means Wow Wow's nose is roughly 50 times more powerful at smelling than Sofia's!

Dogs can smell things humans can't even imagine — a single drop of scent in a swimming pool full of water, or a person who walked through a yard hours ago. That's because when a dog sniffs, tiny scent particles get trapped inside folds of skin in their nose, and each different smell lights up a different part of their brain, almost like a smell "fingerprint."

Wow Wow's nose is also always a little wet, and that's not an accident — the wetness actually helps him catch and hold onto scent particles in the air, making his sense of smell even sharper.

That's why search-and-rescue dogs can find people lost in the wilderness, and why some dogs can be trained to detect certain illnesses just by sniffing a person, long before doctors can find anything with their equipment.

"You're basically a superhero," Sofia said, scratching behind Wow Wow's ears. Wow Wow just wagged his tail and looked very pleased with himself.`,
      es:`Sofia no encontraba su concha de mar favorita por ningún lado. La había traído de la playa y la había dejado en algún lugar del patio — pero, ¿dónde?

La nariz de Wow Wow se movió. Bajó su gran cabeza dorada y empezó a olfatear el pasto, moviéndose en zigzag lento por el patio. En menos de un minuto, se detuvo junto a un arbusto, metió la nariz entre las hojas, y sacó la concha con los dientes, moviendo la cola con orgullo.

—¿Cómo hiciste eso tan rápido? —se rió Sofia, tomando la concha.

Aquí está el secreto: la nariz de un perro es una de las herramientas más increíbles del mundo animal. Mientras que un humano tiene alrededor de 6 millones de células especiales para oler dentro de la nariz, un perro como Wow Wow tiene alrededor de 300 millones. ¡Eso significa que la nariz de Wow Wow es casi 50 veces más poderosa para oler que la de Sofia!

Los perros pueden oler cosas que los humanos ni siquiera pueden imaginar — una sola gota de aroma en una alberca llena de agua, o a una persona que caminó por el patio horas antes. Eso es porque cuando un perro olfatea, diminutas partículas de aroma quedan atrapadas dentro de pliegues de piel en su nariz, y cada aroma diferente enciende una parte diferente de su cerebro, casi como una "huella digital" de olor.

La nariz de Wow Wow también está siempre un poco mojada, y eso no es un accidente — la humedad en realidad le ayuda a atrapar y sostener las partículas de aroma en el aire, haciendo su sentido del olfato aún más agudo.

Por eso los perros de búsqueda y rescate pueden encontrar a personas perdidas en el bosque, y por eso algunos perros pueden entrenarse para detectar ciertas enfermedades solo con oler a una persona, mucho antes de que los doctores puedan encontrar algo con sus equipos.

/* ---- Play-time tracking ---- */
let sessionStartTs = Date.now();
let totalSecondsBase = 0;
function getSessionSeconds(){ return Math.max(0, Math.floor((Date.now()-sessionStartTs)/1000)); }
function getTotalSeconds(){ return totalSecondsBase + getSessionSeconds(); }
function formatDuration(totalSec){
  totalSec = Math.max(0, Math.floor(totalSec));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}

  try{ localStorage.setItem('mathquest_profile_list', JSON.stringify(list)); }catch(e){}

async function saveProgress(){
  try{
    localStorage.setItem('mathquest_profile_data_'+state.profileName, JSON.stringify({
      xp:state.xp, coins:state.coins, crystals:state.crystals, bestStars:state.bestStars, totalSeconds:getTotalSeconds(),
      companionId:state.companionId,
      ownedClosetItems:state.ownedClosetItems, equippedClosetItems:state.equippedClosetItems,
      ownedPetItems:state.ownedPetItems, equippedPetItems:state.equippedPetItems,
      watchedVideos:state.watchedVideos
    }));
    localStorage.setItem('mathquest_lang', LANG);
    localStorage.setItem('mathquest_profile_active', state.profileName);
  }catch(e){ /* storage unavailable (private browsing, etc.) — continue silently */ }
}
async function loadProgress(){
  try{
    let list = getProfileList();
    if(list.length===0){
      // First run of the profile system — migrate any legacy single-profile save
      const legacyRaw = localStorage.getItem('mathquest_progress');
      let legacy = null;
      if(legacyRaw){ try{ legacy = JSON.parse(legacyRaw); }catch(e){} }
      const initialName = 'Sofia Villarreal Castañeda';
      list = [initialName];
      saveProfileList(list);
      localStorage.setItem('mathquest_profile_active', initialName);
      localStorage.setItem('mathquest_profile_data_'+initialName, JSON.stringify({
        xp: legacy ? (legacy.xp||0) : 0,
        coins: legacy ? (legacy.coins||0) : 0,
        crystals: 0,
        bestStars: legacy ? (legacy.bestStars||{}) : {},
        totalSeconds: legacy ? (legacy.totalSeconds||0) : 0,
        companionId: 'dog', // Sofia's existing progress carries forward as Wow Wow, her real plushie
        ownedClosetItems: [], equippedClosetItems: [], ownedPetItems: [], equippedPetItems: [],
        watchedVideos: []
      }));
      if(legacy && legacy.lang) localStorage.setItem('mathquest_lang', legacy.lang);
    }
    LANG = localStorage.getItem('mathquest_lang') === 'es' ? 'es' : 'en';
    let active = localStorage.getItem('mathquest_profile_active') || list[0];
    if(!list.includes(active)) active = list[0];
    state.profileName = active;
    const d = getProfileData(active);
    if(d){
      state.xp = d.xp || 0;
      state.coins = d.coins || 0;
      state.crystals = d.crystals || 0;
      state.bestStars = d.bestStars || {};
      totalSecondsBase = d.totalSeconds || 0;
      state.companionId = d.companionId || null;
      state.ownedClosetItems = d.ownedClosetItems || [];
      state.equippedClosetItems = d.equippedClosetItems || [];
      state.ownedPetItems = d.ownedPetItems || [];
      state.equippedPetItems = d.equippedPetItems || [];
      state.watchedVideos = d.watchedVideos || [];
    }
  }catch(e){ /* no saved progress yet */ }
}

function topicOf(){ return TOPICS.find(t=>t.id===state.topicId); }

function renderProgressDots(){
  let dots='';
  for(let i=0;i<ROUND_LEN;i++){
    let cls='pdot';
    if(i<state.qIndex) cls+=' done';
    else if(i===state.qIndex) cls+=' current';
    dots+=`<span class="${cls}"></span>`;
  }
  return dots;
}

function renderMiniGridSVG(x,y){
  const size=180, cell=size/10;
  let dots='';
  for(let gx=0; gx<=9; gx++){
    for(let gy=0; gy<=9; gy++){
      dots += `<circle cx="${gx*cell+cell/2}" cy="${size-(gy*cell+cell/2)}" r="1.6" fill="#D9D0FF"/>`;
    }
  }
  const px = x*cell+cell/2, py = size-(y*cell+cell/2);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:var(--purple-l); border-radius:14px;">
    <line x1="0" y1="${size-cell/2}" x2="${size}" y2="${size-cell/2}" stroke="#B9ACFF" stroke-width="1.5"/>
    <line x1="${cell/2}" y1="0" x2="${cell/2}" y2="${size}" stroke="#B9ACFF" stroke-width="1.5"/>
    ${dots}
    <circle cx="${px}" cy="${py}" r="7" fill="#FF5DA2" stroke="#fff" stroke-width="2"/>
  </svg>`;
}

function renderPlotGrid(){
  let cells='';
  for(let y=9; y>=0; y--){
    for(let x=0; x<=9; x++){
      let cls='plot-cell';
      if(x===0&&y===0) cls+=' origin';
      if(state.answered){
        const isTarget = x===state.currentQ.target.x && y===state.currentQ.target.y;
        const isPicked = state.plotPick && x===state.plotPick.x && y===state.plotPick.y;
        if(isTarget) cls += (state.plotPick && state.plotPick.x===x && state.plotPick.y===y) ? ' picked-correct' : ' reveal';
        else if(isPicked) cls += ' picked-wrong';
      }
      cells += `<button class="${cls}" data-x="${x}" data-y="${y}" aria-label="(${x}, ${y})"></button>`;
    }
  }
  return `<div class="plot-grid">${cells}</div>`;
}

function renderGame(){
  const topic = topicOf();
  const q = state.currentQ;
  let body = '';

  if(q.type==='mc' || q.type==='grid-identify'){
    const gridVisual = q.type==='grid-identify' ? `<div class="mini-grid-wrap">${renderMiniGridSVG(q.target.x,q.target.y)}</div>` : '';
    const cols = q.choices.length<=2 ? 'two' : '';
    const btns = q.choices.map(c=>{
      let cls='choice-btn';
      if(state.answered){
        if(c===q.answer) cls+=' correct';
        else if(c===state.selected) cls+=' wrong';
      }
      return `<button class="${cls}" data-choice="${esc(c)}" ${state.answered?'disabled':''}>${esc(c)}</button>`;
    }).join('');
    body = `
      <p class="q-prompt">${esc(q.prompt)}</p>
      ${gridVisual}
      <div class="choices-grid ${cols}">${btns}</div>
    `;
  } else if(q.type==='grid-plot'){
    body = `
      <p class="q-prompt">${esc(q.prompt)}</p>
      ${renderPlotGrid()}
    `;
  }

  let feedback = '';
  if(state.answered){
    const wasRight = (q.type==='grid-plot') ? (state.plotPick && state.plotPick.x===q.target.x && state.plotPick.y===q.target.y)
                      : (state.selected===q.answer);
    feedback = `<div class="feedback-row ${wasRight?'ok':'bad'}">${wasRight? pickPraise() : L('wrongFeedback')}</div>
      <button class="chunky c-purple next-btn" id="nextBtn">${state.qIndex+1>=ROUND_LEN? L('seeResults') : L('nextQuestion')}</button>`;
  } else {
    feedback = `<div class="feedback-row"></div>`;
  }

  return `
  <div class="game-wrap">
    <div class="game-topbar">
      <button class="back-link" id="backBtn">${L('backHub')}</button>
      <div class="progress-dots">${renderProgressDots()}</div>
      <div class="streak-chip">🔥 ${state.streak}</div>

    <div class="q-card">
      <div style="font-family:'Baloo 2'; font-size:13px; color:var(--ink-soft); font-weight:800; margin-bottom:10px;">
        ${topic.icon} ${topicText(topic.id).name.toUpperCase()} · ${L('qLabel')}${state.qIndex+1} ${L('of')} ${ROUND_LEN}
      </div>
      ${body}
      ${feedback}
    </div>
  </div>`;
}

function spawnFloatPop(text, x, y, color){
  const el = document.createElement('div');
  el.className='float-pop';
  el.textContent = text;
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.style.color = color;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

function wireGame(){
  document.getElementById('backBtn').addEventListener('click', ()=>{ state.screen='hub'; render(); });

  if(state.currentQ.type==='grid-plot' && !state.answered){
    document.querySelectorAll('.plot-cell').forEach(cell=>{
      cell.addEventListener('click', (e)=>{
        const x = parseInt(cell.getAttribute('data-x'));
        const y = parseInt(cell.getAttribute('data-y'));
        state.plotPick = {x,y};
        answerQuestion(x===state.currentQ.target.x && y===state.currentQ.target.y, e);
      });
    });
  } else if(!state.answered){
    document.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const val = btn.getAttribute('data-choice');
        state.selected = val;
        answerQuestion(val===state.currentQ.answer, e);
      });
    });
  }

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.addEventListener('click', nextQuestion);
}

function answerQuestion(isCorrect, evt){
  state.answered = true;
  const rect = evt.target.getBoundingClientRect();
  if(isCorrect){
    state.correct++;
    state.streak++;
    const bonus = Math.min(state.streak*2, 20);
    const coinsGained = 10 + bonus;
    const xpGained = 15;
    const crystalsGained = 2;
    state.coins += coinsGained;
    state.crystals += crystalsGained;
    state.roundCoins += coinsGained;
    state.roundXP += xpGained;
    const prevLevel = levelFromXP(state.xp);
    state.xp += xpGained;
    spawnFloatPop(`+${coinsGained} 🦴`, rect.left+rect.width/2-20, rect.top-10, '#FFC93C');
    const newLevel = levelFromXP(state.xp);
    if(newLevel>prevLevel){ showLevelUp(newLevel); }
  } else {
    state.streak = 0;
    state.coins += 2;
    state.roundCoins += 2;
    state.xp += 3;
    state.roundXP += 3;
  }
  render();
  saveProgress();
}

function showLevelUp(lvl){
  setTimeout(()=>{
    const t = document.createElement('div');
    t.className='levelup-toast';
    t.textContent = LANG==='en' ? `🎉 Level Up! You're now Level ${lvl}!` : `🎉 ¡Subiste de Nivel! ¡Ahora eres Nivel ${lvl}!`;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
  }, 50);
}

function nextQuestion(){
  state.qIndex++;
  if(state.qIndex>=ROUND_LEN){
    finishRound();
    return;
  }
  const topic = topicOf();
  state.currentQ = topic.gen();
  state.answered = false;
  state.selected = null;
  state.plotPick = null;
  render();
}

function finishRound(){
  const acc = state.correct / ROUND_LEN;
  let stars = 1;
  if(acc>=0.9) stars=3; else if(acc>=0.65) stars=2; else stars=1;
  const prevBest = state.bestStars[state.topicId] || 0;
  if(stars>prevBest) state.bestStars[state.topicId] = stars;
  state.screen='summary';
  render();
  saveProgress();
}

function renderReadingQuiz(){
  const story = currentStory();
  const q = story.questions[state.storyQIndex][LANG];
  const btns = q.choices.map(c=>{
    let cls='choice-btn';
    if(state.storyAnswered){
      if(c===q.answer) cls+=' correct';
      else if(c===state.storySelected) cls+=' wrong';
    }
    return `<button class="${cls}" data-choice="${esc(c)}" ${state.storyAnswered?'disabled':''}>${esc(c)}</button>`;
  }).join('');
  let feedback = '';
  if(state.storyAnswered){
    const wasRight = state.storySelected===q.answer;
    feedback = `<div class="feedback-row ${wasRight?'ok':'bad'}">${wasRight? pickPraise() : L('wrongFeedback')}</div>
      <button class="chunky c-purple next-btn" id="storyNextBtn">${state.storyQIndex+1>=story.questions.length? L('seeResults') : L('nextQuestion')}</button>`;
  } else {
    feedback = `<div class="feedback-row"></div>`;
  }
  return `
  <div class="game-wrap">
    <div class="game-topbar">
      <button class="back-link" id="backBtn">${L('backHub')}</button>
      <div class="progress-dots">${story.questions.map((_,i)=>`<span class="pdot ${i<state.storyQIndex?'done':(i===state.storyQIndex?'current':'')}"></span>`).join('')}</div>
      <div></div>
    </div>
    <div class="q-card">
      <div style="font-family:'Baloo 2'; font-size:13px; color:var(--ink-soft); font-weight:800; margin-bottom:10px;">
        ${story.icon} ${story.title[LANG].toUpperCase()} · ${L('qLabel')}${state.storyQIndex+1} ${L('of')} ${story.questions.length}
      </div>
      <p class="q-prompt">${esc(q.prompt)}</p>
      <div class="choices-grid">${btns}</div>
      ${feedback}
    </div>
  </div>`;
}
function wireReadingQuiz(){
  document.getElementById('backBtn').addEventListener('click', ()=>{ state.screen='hub'; render(); });
  if(!state.storyAnswered){
    document.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const val = btn.getAttribute('data-choice');
        state.storySelected = val;
        answerStoryQuestion(val===currentStory().questions[state.storyQIndex][LANG].answer);
      });
    });
  }
  const nextBtn = document.getElementById('storyNextBtn');
  if(nextBtn) nextBtn.addEventListener('click', nextStoryQuestion);
}
function answerStoryQuestion(isCorrect){
  state.storyAnswered = true;
  if(isCorrect){
    state.storyCorrect++;
    const coinsGained = 10, xpGained = 15, crystalsGained = 2;
    state.coins += coinsGained; state.storyRoundCoins += coinsGained;
    state.crystals += crystalsGained;
    state.xp += xpGained; state.storyRoundXP += xpGained;
  } else {
    state.coins += 2; state.storyRoundCoins += 2;
    state.xp += 3; state.storyRoundXP += 3;
  }
  render();
  saveProgress();
}
function nextStoryQuestion(){
  const story = currentStory();
  state.storyQIndex++;
  if(state.storyQIndex >= story.questions.length){ finishReading(); return; }
  state.storyAnswered = false;
  state.storySelected = null;
  render();
}
function finishReading(){
  const story = currentStory();
  const acc = state.storyCorrect / story.questions.length;
  let stars = acc>=0.9?3:acc>=0.65?2:1;
  const key = 'read_'+story.id;
  const prevBest = state.bestStars[key] || 0;
  if(stars>prevBest) state.bestStars[key] = stars;
  const overallPrev = state.bestStars['read'] || 0;
  if(stars>overallPrev) state.bestStars['read'] = stars;
  state.screen = 'reading-summary';
  render();
  saveProgress();
}
function renderReadingSummary(){
  const story = currentStory();
  const acc = state.storyCorrect/story.questions.length;
  let earnedStars = acc>=0.9?3:acc>=0.65?2:1;
  const starDisplay = '⭐'.repeat(earnedStars)+'☆'.repeat(3-earnedStars);
  const completeTitle = LANG==='en' ? `${story.title[LANG]} Complete!` : `¡${story.title[LANG]} Completado!`;
  return `
  <div class="summary-card">
    <div style="font-size:44px;">${story.icon}</div>
    <h2 style="margin:6px 0 0;">${completeTitle}</h2>
    <div class="stars-row">${starDisplay}</div>
    <div class="summary-stats">
      <div class="stat-box"><div class="num">${state.storyCorrect}/${story.questions.length}</div><div class="lbl">${L('correctStat')}</div></div>
      <div class="stat-box"><div class="num">+${state.storyRoundCoins}</div><div class="lbl">${L('bonesStat')}</div></div>
      <div class="stat-box"><div class="num">+${state.storyRoundXP}</div><div class="lbl">${L('xpStat')}</div></div>
    </div>
    <div class="summary-btns">
      <button class="chunky c-coral" id="storyAgainBtn">${L('playAgain')}</button>
      <button class="chunky c-purple" id="storyListBtn">${LANG==='en'?'More Stories':'Más Cuentos'}</button>
      <button class="chunky c-purple" id="hubBtn2">${L('backToHub')}</button>
    </div>
  </div>`;
}

async function switchProfile(name){
  await saveProgress();
  state.profileName = name;
  const d = getProfileData(name) || {xp:0,coins:0,crystals:0,bestStars:{},totalSeconds:0,companionId:null,ownedClosetItems:[],equippedClosetItems:[],ownedPetItems:[],equippedPetItems:[],watchedVideos:[]};
  state.xp = d.xp||0; state.coins = d.coins||0; state.crystals = d.crystals||0; state.bestStars = d.bestStars||{};
  totalSecondsBase = d.totalSeconds||0;
  state.companionId = d.companionId || null;
  state.ownedClosetItems = d.ownedClosetItems || [];
  state.equippedClosetItems = d.equippedClosetItems || [];
  state.ownedPetItems = d.ownedPetItems || [];
  state.equippedPetItems = d.equippedPetItems || [];
  state.watchedVideos = d.watchedVideos || [];
  sessionStartTs = Date.now();
  try{ localStorage.setItem('mathquest_profile_active', name); }catch(e){}
  state.screen = state.companionId ? 'hub' : 'companion-select';
  render();
}
async function addProfile(name){
  let list = getProfileList();
  if(list.includes(name)){ switchProfile(name); return; }
  if(list.length >= MAX_PROFILES) return;
  list.push(name);
  saveProfileList(list);
  try{ localStorage.setItem('mathquest_profile_data_'+name, JSON.stringify({
    xp:0,coins:0,crystals:0,bestStars:{},totalSeconds:0,companionId:null,
    ownedClosetItems:[],equippedClosetItems:[],ownedPetItems:[],equippedPetItems:[],
    watchedVideos:[]
  })); }catch(e){}
  await switchProfile(name);
}

    el.addEventListener('click', ()=>{ state.shopTab = el.getAttribute('data-shoptab'); render(); });
  });

    el.addEventListener('click', ()=>{ handleClosetItemClick(el.getAttribute('data-closetitem')); });
  });
}
async function handleClosetItemClick(itemId){
  const item = CLOSET_ITEMS.find(i=>i.id===itemId);
  if(!item) return;
  const owned = state.ownedClosetItems.includes(itemId);
  if(!owned){
    if(state.coins < item.price){
      flashShopMessage(L('notEnough'));
      return;
    }
    state.coins -= item.price;
    state.ownedClosetItems.push(itemId);
    await saveProgress();
    render();
    return;
  }
  // toggle equip (one item per category at a time)
  const sameCatOwned = CLOSET_ITEMS.filter(i=>i.cat===item.cat).map(i=>i.id);
  if(state.equippedClosetItems.includes(itemId)){
    state.equippedClosetItems = state.equippedClosetItems.filter(id=>id!==itemId);
  } else {
    state.equippedClosetItems = state.equippedClosetItems.filter(id=>!sameCatOwned.includes(id));
    state.equippedClosetItems.push(itemId);
  }
  await saveProgress();
  render();
}
function flashShopMessage(msg){
  const existing = document.getElementById('shopMsgEl');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'shopMsgEl';
  t.className = 'levelup-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}

function wirePetShop(){

      handlePetItemClick(el.getAttribute('data-petitem'), el.getAttribute('data-istreat')==='1');
    });
  });
}
async function handlePetItemClick(itemId, isTreat){
  const companion = companionById(state.companionId || 'dog');
  if(isTreat){
    const treat = (PET_TREATS[companion.id]||[]).find(i=>i.id===itemId);
    if(!treat) return;
    if(state.crystals < treat.price){ flashShopMessage(L('notEnough')); return; }
    state.crystals -= treat.price;
    await saveProgress();
    flashShopMessage(LANG==='en' ? `${companion.name.en} loved that treat! 💕` : `¡A ${companion.name.es} le encantó! 💕`);
    return;
  }
  const item = PET_ITEMS.find(i=>i.id===itemId);
  if(!item) return;
  const owned = state.ownedPetItems.includes(itemId);
  if(!owned){
    if(state.crystals < item.price){ flashShopMessage(L('notEnough')); return; }
    state.crystals -= item.price;
    state.ownedPetItems.push(itemId);
    await saveProgress();
    render();
    return;
  }
  const sameCatOwned = PET_ITEMS.filter(i=>i.cat===item.cat).map(i=>i.id);
  if(state.equippedPetItems.includes(itemId)){
    state.equippedPetItems = state.equippedPetItems.filter(id=>id!==itemId);
  } else {
    state.equippedPetItems = state.equippedPetItems.filter(id=>!sameCatOwned.includes(id));
    state.equippedPetItems.push(itemId);
  }
  await saveProgress();
  render();
}

      const answerDiv = document.createElement('div');
      answerDiv.className = 'wp-reveal';
      answerDiv.textContent = (LANG==='en'?'Answer: ':'Respuesta: ') + state.currentQ.answer;
      panel.insertBefore(answerDiv, panel.querySelector('.wp-btns'));
      document.getElementById('wpReveal').remove();
    });
    document.getElementById('wpClose').addEventListener('click', closeWebsterPanel);
  } else if(inReadingQuiz){
    const story = currentStory();
    const q = story.questions[state.storyQIndex][LANG];
    const tip = LANG==='en' ? 'Try thinking back to what happened in the story — the answer is somewhere in what you just read!' : 'Piensa en lo que pasó en el cuento — ¡la respuesta está en lo que acabas de leer!';
    panel.innerHTML = `
      <div class="wp-title">🕷️ ${LANG==='en'?"Webster's Hint":'La Pista de Webster'}</div>
      <div class="wp-text">${tip}</div>
      <div class="wp-btns">
        <button class="chunky c-green wp-action" id="wpReveal">${LANG==='en'?'Show Me the Answer':'Muéstrame la Respuesta'}</button>
        <button class="chunky c-purple wp-action" id="wpClose">${LANG==='en'?'Got It, Thanks!':'¡Entendido, Gracias!'}</button>
      </div>`;
    document.getElementById('wpReveal').addEventListener('click', ()=>{
      const answerDiv = document.createElement('div');
      answerDiv.className = 'wp-reveal';
      answerDiv.textContent = (LANG==='en'?'Answer: ':'Respuesta: ') + q.answer;
      panel.insertBefore(answerDiv, panel.querySelector('.wp-btns'));
      document.getElementById('wpReveal').remove();
    });
    document.getElementById('wpClose').addEventListener('click', closeWebsterPanel);
  } else {
    const lines = SPIDER_LINES[LANG];
    panel.innerHTML = `
      <div class="wp-title">🕷️ ${LANG==='en'?'Webster says':'Webster dice'}</div>
      <div class="wp-text">${lines[randInt(0,lines.length-1)]}</div>
      <div class="wp-btns">
        <button class="chunky c-purple wp-action" id="wpClose">${LANG==='en'?'Okay!':'¡Okay!'}</button>
      </div>`;
    document.getElementById('wpClose').addEventListener('click', closeWebsterPanel);
  }
}
function createWebsterBot(){
  const bot = document.createElement('div');
  bot.id = 'websterBotEl';
  bot.className = 'webster-bot';
  bot.title = L('spiderTitle');
  bot.innerHTML = spiderSVG();
  bot.addEventListener('click', onWebsterClick);
  document.body.appendChild(bot);
}

/* ============================================================
   MESSAGE DAD — actually delivers to Pascual via a backend email API
   (no Claude/Anthropic tokens involved — this is a plain email send,
   so there is no per-message AI cost at all)
   ============================================================ */
function closeDadPanel(){
  const existing = document.getElementById('dadPanelEl');
  if(existing) existing.remove();
}
function onDadClick(){
  if(document.getElementById('dadPanelEl')){ closeDadPanel(); return; }
  closeWebsterPanel();
  const panel = document.createElement('div');
  panel.id = 'dadPanelEl';
  panel.className = 'dad-panel';
  document.body.appendChild(panel);
  renderDadPanelIdle(panel);
}
function renderDadPanelIdle(panel){
  panel.innerHTML = `
    <div class="dp-title">💌 ${LANG==='en'?'Message Dad':'Mensaje para Papá'}</div>
    <textarea id="dadMsgBox" maxlength="500" placeholder="${LANG==='en'?'Type your message...':'Escribe tu mensaje...'}"></textarea>
    <div class="dp-btns">
      <button class="chunky c-blue dp-action" id="dadSendBtn">✉️ ${LANG==='en'?'Send to Dad':'Enviar a Papá'}</button>
      <button class="chunky c-purple dp-action" id="dadClose">${LANG==='en'?'Cancel':'Cancelar'}</button>
    </div>`;
  document.getElementById('dadSendBtn').addEventListener('click', ()=>sendDadMessage(panel));
  document.getElementById('dadClose').addEventListener('click', closeDadPanel);
}
async function sendDadMessage(panel){
  const box = document.getElementById('dadMsgBox');
  const message = box ? box.value.trim() : '';
  if(!message) return;
  panel.innerHTML = `
    <div class="dp-title">💌 ${LANG==='en'?'Message Dad':'Mensaje para Papá'}</div>
    <div class="wp-text">${LANG==='en'?'Sending... 🐾':'Enviando... 🐾'}</div>`;
  try{
    const resp = await fetch('/api/send-dad-message', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message, from: state.profileName, lang: LANG })
    });
    if(!resp.ok){
      let bodyText = '';
      try{ bodyText = await resp.text(); }catch(e2){}
      console.error('[MathQuest] send-dad-message failed — status:', resp.status, 'body:', bodyText);
      throw new Error('send failed: '+resp.status);
    }
    panel.innerHTML = `
      <div class="dp-title">💌 ${LANG==='en'?'Message Dad':'Mensaje para Papá'}</div>
      <div class="wp-text">${LANG==='en'?'Sent! Dad will get it soon. 💌':'¡Enviado! Papá lo recibirá pronto. 💌'}</div>
      <div class="dp-btns"><button class="chunky c-purple dp-action" id="dadClose2">${LANG==='en'?'Okay!':'¡Okay!'}</button></div>`;
    document.getElementById('dadClose2').addEventListener('click', closeDadPanel);
  }catch(e){
    console.error('[MathQuest] send-dad-message error:', e);
    panel.innerHTML = `
      <div class="dp-title">💌 ${LANG==='en'?'Message Dad':'Mensaje para Papá'}</div>
      <div class="wp-text">${LANG==='en'?"Hmm, that didn't send. Try again in a bit, or tell Dad in person!":'Mmm, eso no se envió. ¡Inténtalo de nuevo más tarde, o dile a Papá en persona!'}</div>
      <div class="dp-btns"><button class="chunky c-purple dp-action" id="dadClose3">${LANG==='en'?'Okay':'Okay'}</button></div>`;
    document.getElementById('dadClose3').addEventListener('click', closeDadPanel);
  }
}
function createDadBot(){
  const bot = document.createElement('div');
  bot.id = 'dadBotEl';
  bot.className = 'dad-bot';
  bot.title = LANG==='en' ? 'Message Dad' : 'Mensaje para Papá';
  bot.textContent = '💌';
  bot.addEventListener('click', onDadClick);
  document.body.appendChild(bot);
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadProgress();
  state.screen = state.companionId ? 'hub' : 'companion-select';
  render();
  createWebsterBot();
  createDadBot();
  setInterval(saveProgress, 20000);
  window.addEventListener('pagehide', ()=>{ saveProgress(); });
})();
</script>
